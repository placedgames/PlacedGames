services:
    - type: web
      name: placedgames
      runtime: node
      plan: free
      buildCommand: npm install
      startCommand: node server.js
      envVars:
          - key: NODE_VERSION
            value: "20"
          - key: BOT_TOKEN
            sync: false
          - key: ADMIN_TOKEN
            sync: false
databases:
    - name: placedgames-db
      plan: free
      databaseName: app
      user: app
