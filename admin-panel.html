  // ----- переписка -----
  function chatIsNearBottom() {
    const el = $('chatMessages');
    return el.scrollHeight - el.scrollTop - el.clientHeight < 120;
  }
  function chatScrollBottom() {
    const el = $('chatMessages');
    el.scrollTop = el.scrollHeight;
  }
  function chatLastDayKey() {
    const last = chatState.msgs[chatState.msgs.length - 1];
    const d = last && chatDateObj(last.created_at);
    return d ? chatDayKey(d) : '';
  }
  const CHAT_ICON_PLAY = `<svg width="22" height="22" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
  const CHAT_ICON_PAUSE = `<svg width="20" height="20" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>`;
  const CHAT_MEDIA_KINDS = ['photo', 'video', 'video_note', 'voice', 'animation', 'sticker'];

  function chatRatio(meta, def) {
    const w = Number(meta.w), h = Number(meta.h);
    const r = (w > 0 && h > 0) ? w / h : def;
    return Math.min(Math.max(r, 0.7), 1.7);
  }

  function chatMediaHtml(m) {
    const id = escapeHtml(m.id);
    const meta = chatMeta(m);
    switch (m.kind) {
      case 'photo':
        return `<div class="chat-media chat-photo" data-kind="photo" data-id="${id}" style="aspect-ratio:${chatRatio(meta, 4 / 3).toFixed(3)}"><span class="chat-ph">Фото</span></div>`;
      case 'animation':
        return `<div class="chat-media chat-photo" data-kind="animation" data-id="${id}" style="aspect-ratio:${chatRatio(meta, 4 / 3).toFixed(3)}"><span class="chat-ph">GIF</span></div>`;
      case 'video':
        return `<div class="chat-media chat-video" data-kind="video" data-id="${id}" data-thumb="${m.has_thumb ? 1 : 0}" style="aspect-ratio:${chatRatio(meta, 16 / 9).toFixed(3)}">`
          + `<span class="chat-ph">Видео</span>${meta.d ? `<span class="chat-dur">${chatFmtDur(meta.d)}</span>` : ''}<span class="chat-play">${CHAT_ICON_PLAY}</span></div>`;
      case 'video_note':
        return `<div class="chat-media is-round" data-kind="video_note" data-id="${id}" data-thumb="${m.has_thumb ? 1 : 0}">`
          + `<span class="chat-ph">Видеосообщение</span>${meta.d ? `<span class="chat-dur">${chatFmtDur(meta.d)}</span>` : ''}<span class="chat-play">${CHAT_ICON_PLAY}</span></div>`;
      case 'sticker': {
        const useThumb = (meta.anim || meta.vid) ? 1 : 0; // анимированные стикеры показываем статичным превью
        return `<div class="chat-media is-sticker" data-kind="sticker" data-id="${id}" data-thumb="${useThumb}"><span class="chat-ph">${escapeHtml(meta.emoji || 'Стикер')}</span></div>`;
      }
      case 'voice':
        return `<div class="chat-voice" data-id="${id}" data-dur="${Number(meta.d) || 0}">`
          + `<button class="chat-voice-btn" type="button" aria-label="Воспроизвести"><span class="ic-play">${CHAT_ICON_PLAY}</span><span class="ic-pause">${CHAT_ICON_PAUSE}</span></button>`
          + `<div class="chat-voice-main"><div class="chat-voice-bar"><i></i></div><span class="chat-voice-dur">${chatFmtDur(meta.d)}</span></div></div>`;
    }
    return '';
  }

  function chatBubbleHtml(m, timeStr) {
    const timeHtml = `<span class="chat-time">${escapeHtml(timeStr)}</span>`;
    const isMedia = CHAT_MEDIA_KINDS.includes(m.kind);
    if (isMedia) {
      const bare = m.kind === 'sticker' || m.kind === 'video_note';
      const cap = (m.text && !bare)
        ? `<div class="chat-text chat-caption">${escapeHtml(m.text)}${timeHtml}</div>`
        : `<div class="chat-time-row">${escapeHtml(timeStr)}</div>`;
      const photoLike = m.kind === 'photo' || m.kind === 'animation' || m.kind === 'video';
      return `<div class="chat-bubble ${bare ? 'is-bare' : (photoLike ? 'has-media has-photo' : 'has-media')}">${chatMediaHtml(m)}${cap}</div>`;
    }
    const body = m.text
      ? `<div class="chat-text">${escapeHtml(m.text)}${timeHtml}</div>`
      : `<div class="chat-text chat-muted">Сообщение без текста${timeHtml}</div>`;
    return `<div class="chat-bubble">${body}</div>`;
  }

  function chatMsgsHtml(list, prevKey) {
    let html = '';
    let pk = prevKey || '';
    for (const m of list) {
      const d = chatDateObj(m.created_at);
      const key = d ? chatDayKey(d) : pk;
      const sep = d && key !== pk ? `<div class="chat-date-sep">${escapeHtml(chatDayLabel(d))}</div>` : '';
      const dir = m.direction === 'out' ? 'out' : 'in';
      html += `${sep}<div class="chat-msg ${dir}${m.pending ? ' pending' : ''}" data-msg-id="${escapeHtml(m.id)}">`
        + chatBubbleHtml(m, d ? chatFmtClock(d) : '')
        + `</div>`;
      pk = key;
    }
    return html;
  }
  function chatRenderAll() {
    const el = $('chatMessages');
    chatStopAudio();
    chatState.observer && chatState.observer.disconnect();
    if (!chatState.msgs.length) {
      el.innerHTML = `<div class="chat-empty">Сообщений пока нет</div>`;
      return;
    }
    el.innerHTML = chatMsgsHtml(chatState.msgs, '');
    chatTightenBubbles(el);
    chatHydrateMedia(el);
  }
  function chatAppendMsgs(list) {
    if (!list.length) return;
    const el = $('chatMessages');
    const near = chatIsNearBottom();
    const prevKey = chatLastDayKey();
    chatState.msgs = chatState.msgs.concat(list);
    el.querySelector('.chat-empty')?.remove();
    el.insertAdjacentHTML('beforeend', chatMsgsHtml(list, prevKey));
    chatTightenBubbles(el);
    chatHydrateMedia(el);
    if (near || list.some(m => m.direction === 'out')) chatScrollBottom();
    // пока чат открыт, новые входящие сразу считаются прочитанными
    if (list.some(m => m.direction === 'in') && !document.hidden) chatMarkRead();
  }

  // пузырь по ширине равен самой длинной строке (без пустоты справа), время помещается в последней строке
  function chatTightenBubbles(root) {
    root.querySelectorAll('.chat-bubble:not([data-tight])').forEach(b => {
      b.dataset.tight = '1';
      const t = b.querySelector('.chat-text');
      if (!t) return;
      const node = Array.from(t.childNodes).find(n => n.nodeType === 3);
      if (!node || !b.offsetWidth) return;
      const range = document.createRange();
      range.setStart(node, 0);
      range.setEnd(node, node.length);
      const rects = Array.from(range.getClientRects()).filter(r => r.width > 0);
      if (!rects.length) return;
      let minL = Infinity, maxR = -Infinity, last = rects[0];
      rects.forEach(r => {
        minL = Math.min(minL, r.left);
        maxR = Math.max(maxR, r.right);
        if (r.top >= last.top) last = r;
      });
      const timeEl = t.querySelector('.chat-time');
      const timeW = timeEl ? timeEl.offsetWidth + 10 : 0;
      const needed = Math.max(maxR - minL, (last.right - minL) + timeW);
      const tcs = getComputedStyle(t);
      const avail = t.clientWidth - parseFloat(tcs.paddingLeft) - parseFloat(tcs.paddingRight);
      if (needed + 1 >= avail) return;
      const extra = b.getBoundingClientRect().width - avail;
      b.style.width = Math.ceil(needed + extra + 1) + 'px';
    });
  }

  // ----- информация о сообщении (долгое нажатие) и удаление -----
  const CHAT_TYPE_LABELS = {
    text: 'Сообщение', photo: 'Фото', video: 'Видео', video_note: 'Видеосообщение',
    voice: 'Голосовое сообщение', animation: 'GIF', sticker: 'Стикер'
  };
  function chatFmtFullDate(d) {
    const day = new Intl.DateTimeFormat('ru-RU', { timeZone: CHAT_TZ, day: '2-digit', month: '2-digit', year: '2-digit' }).format(d);
    return `${chatFmtClock(d)} ${day}`;
  }

  function chatShowMsgInfo(msgId) {
    const m = chatState.msgs.find(x => String(x.id) === String(msgId));
    if (!m) return;
    hapticLight();
    const d = chatDateObj(m.created_at);
    let message = `Информация о сообщении:\n\nТип: ${CHAT_TYPE_LABELS[m.kind] || 'Сообщение'}\nДата: ${d ? chatFmtFullDate(d) : '—'}`;
    if (m.text) message += `\nТекст сообщения:\n${m.text}`;
    showPopup({
      message,
      buttons: [
        { id: 'close', type: 'default', text: 'Закрыть' },
        { id: 'delete', type: 'destructive', text: 'Удалить' }
      ]
    }, (id) => {
      if (id !== 'delete') return;
      showPopup({
        message: 'Удалить сообщение? Оно будет удалено в чате, у пользователя и у бота.',
        buttons: [{ id: 'yes', type: 'destructive', text: 'Удалить' }, { id: 'cancel', type: 'cancel' }]
      }, (id2) => { if (id2 === 'yes') chatDeleteMsg(m); });
    });
  }

  async function chatDeleteMsg(m) {
    const uid = chatState.userId;
    if (!uid) return;
    try {
      const r = await apiSend('DELETE', `/api/admin/chats/${encodeURIComponent(uid)}/messages/${encodeURIComponent(m.id)}`);
      if (uid !== chatState.userId) return;
      if (r.ok) {
        chatRemoveMsgs([String(m.id)]);
        if (r.data && r.data.telegram === false) chatToast('Удалено в чате, но Telegram не дал удалить у пользователя (прошло больше 48 часов)');
        else if (r.data && r.data.telegram === null) chatToast('Удалено в чате. У пользователя удалить нельзя: сообщение отправлено до обновления');
        else hapticLight();
      } else {
        chatToast((r.data && r.data.error) || 'Не удалось удалить');
      }
    } catch (e) {
      chatToast('Ошибка соединения');
    }
  }

  // убираем сообщения из чата (удалены здесь, на другом устройстве или ботом при смене статуса заказа)
  function chatRemoveMsgs(ids) {
    const set = new Set(ids.map(String));
    const before = chatState.msgs.length;
    chatState.msgs = chatState.msgs.filter(m => !set.has(String(m.id)));
    if (chatState.msgs.length === before) return;
    const el = $('chatMessages');
    const keep = el.scrollTop;
    const wasBottom = chatIsNearBottom();
    chatRenderAll();
    if (wasBottom) chatScrollBottom(); else el.scrollTop = keep;
  }

  async function chatMarkRead() {
    const uid = chatState.userId;
    if (!uid) return;
    const c = chatsList.find(x => String(x.user_id) === String(uid));
    if (c) c.unread = false;
    try { await apiSend('POST', `/api/admin/chats/${encodeURIComponent(uid)}/read`, {}); } catch (e) {}
  }

  // медиа: файлы не хранятся на сервере — берём у Telegram по требованию и держим в памяти вкладки (blob)
  async function chatBlobUrl(id, thumb) {
    const key = String(id) + (thumb ? ':t' : '');
    const cached = chatState.blobs.get(key);
    if (cached) return cached;
    const waiting = chatState.pending.get(key);
    if (waiting) return waiting;
    const token = chatState.token;
    const job = (async () => {
      const r = await fetch(API + '/api/admin/chat-media/' + encodeURIComponent(id) + (thumb ? '?thumb=1' : ''), {
        cache: 'no-store', headers: { 'Authorization': `Bearer ${getAdminToken()}` }
      });
      if (!r.ok) {
        let msg = '';
        try { msg = (await r.json()).error || ''; } catch (e) {}
        const err = new Error(msg || ('HTTP ' + r.status));
        err.userMessage = msg;
        throw err;
      }
      const blob = await r.blob();
      if (token !== chatState.token) throw new Error('stale');
      const url = URL.createObjectURL(blob);
      chatState.blobs.set(key, url);
      return url;
    })();
    chatState.pending.set(key, job);
    try { return await job; } finally { chatState.pending.delete(key); }
  }

  function chatHydrateMedia(root) {
    root.querySelectorAll('.chat-media[data-id]:not([data-state])').forEach(box => {
      box.dataset.state = 'wait';
      if (chatState.observer) chatState.observer.observe(box);
      else chatLoadMedia(box);
    });
  }

  function chatSetPlaceholder(box, text) {
    const ph = box.querySelector('.chat-ph');
    if (ph) ph.textContent = text;
  }

  async function chatLoadMedia(box) {
    const kind = box.dataset.kind;
    const hasThumb = box.dataset.thumb === '1';
    const token = chatState.token;
    // видео и кружки: до нажатия показываем только превью
    if ((kind === 'video' || kind === 'video_note') && !hasThumb) { box.dataset.state = 'ok'; return; }
    const wantThumb = (kind === 'video' || kind === 'video_note') ? true : (kind === 'sticker' ? hasThumb : false);
    box.dataset.state = 'loading';
    try {
      const url = await chatBlobUrl(box.dataset.id, wantThumb);
      if (token !== chatState.token || !box.isConnected) return;
      box.querySelector('.chat-ph')?.remove();
      if (kind === 'animation') {
        const v = document.createElement('video');
        v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
        v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
        v.src = url;
        box.insertBefore(v, box.firstChild);
        v.play().catch(() => {});
      } else {
        const img = document.createElement('img');
        img.alt = ''; img.draggable = false; img.src = url;
        box.insertBefore(img, box.firstChild);
      }
      box.dataset.state = 'ok';
    } catch (e) {
      if (token === chatState.token && box.isConnected) {
        chatSetPlaceholder(box, e && e.userMessage ? e.userMessage : 'Не загрузилось. Нажмите, чтобы повторить');
        box.dataset.state = 'error';
      }
    }
  }

  async function chatPlayVideo(box) {
    box.classList.add('loading');
    const token = chatState.token;
    try {
      const url = await chatBlobUrl(box.dataset.id, false);
      if (token !== chatState.token || !box.isConnected) return;
      const v = document.createElement('video');
      v.playsInline = true; v.autoplay = true;
      v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
      v.controls = box.dataset.kind === 'video';
      v.src = url;
      const poster = box.querySelector('img');
      if (poster) v.poster = poster.src;
      box.querySelector('.chat-play')?.remove();
      box.querySelector('.chat-dur')?.remove();
      box.appendChild(v);
      box.dataset.playing = '1';
      v.addEventListener('ended', () => {
        if (box.dataset.kind === 'video_note') {
          v.currentTime = 0;
          if (!box.querySelector('.chat-play')) box.insertAdjacentHTML('beforeend', `<span class="chat-play">${CHAT_ICON_PLAY}</span>`);
        }
      });
      v.addEventListener('play', () => box.querySelector('.chat-play')?.remove());
      v.addEventListener('playing', () => box.querySelector(':scope > img')?.remove());
      v.play().catch(() => {});
    } catch (e) {
      if (token === chatState.token) chatToast((e && e.userMessage) || 'Не удалось загрузить видео');
    } finally {
      box.classList.remove('loading');
    }
  }

  function chatStopAudio() {
    const c = chatState.audio;
    if (!c) return;
    chatState.audio = null;
    try { c.el.pause(); } catch (e) {}
    c.box.classList.remove('playing');
    const bar = c.box.querySelector('.chat-voice-bar i');
    if (bar) bar.style.width = '0';
  }

  async function chatToggleVoice(box) {
    const cur = chatState.audio;
    if (cur && cur.box === box) {
      if (cur.el.paused) cur.el.play().catch(() => {}); else cur.el.pause();
      return;
    }
    chatStopAudio();
    box.classList.add('loading');
    const token = chatState.token;
    try {
      const url = await chatBlobUrl(box.dataset.id, false);
      if (token !== chatState.token || !box.isConnected) return;
      const a = new Audio(url);
      const bar = box.querySelector('.chat-voice-bar i');
      const total = Number(box.dataset.dur) || 0;
      chatState.audio = { box, el: a };
      a.addEventListener('timeupdate', () => {
        const dur = isFinite(a.duration) && a.duration > 0 ? a.duration : total;
        if (bar && dur) bar.style.width = Math.min(100, a.currentTime / dur * 100) + '%';
      });
      a.addEventListener('play', () => box.classList.add('playing'));
      a.addEventListener('pause', () => box.classList.remove('playing'));
      a.addEventListener('ended', () => chatStopAudio());
      a.addEventListener('error', () => { chatToast('Не удалось воспроизвести голосовое на этом устройстве'); chatStopAudio(); });
      await a.play();
    } catch (e) {
      chatToast((e && e.userMessage) || 'Не удалось воспроизвести голосовое');
      chatStopAudio();
    } finally {
      box.classList.remove('loading');
    }
  }

  // фото на весь экран: закрывается тапом по фото или по затемнённой области
  function chatLightboxOpen() { return $('chatLightbox').classList.contains('open'); }
  function chatOpenLightbox(src) {
    const lb = $('chatLightbox');
    lb.querySelector('img').src = src;
    lb.classList.add('open');
  }
  function chatCloseLightbox() {
    const lb = $('chatLightbox');
    lb.classList.remove('open');
    lb.querySelector('img').removeAttribute('src');
  }

  function chatStopPoll() {
    if (chatState.pollTimer) clearInterval(chatState.pollTimer);
    chatState.pollTimer = null;
  }
  function chatStartPoll() {
    chatStopPoll();
    chatState.pollTimer = setInterval(chatPoll, CHAT_POLL_MS);
  }
  async function chatPoll(force) {
    if (!chatState.userId || (document.hidden && !force)) return;
    const uid = chatState.userId;
    const token = chatState.token;
    try {
      const list = await apiGet(`/api/admin/chats/${encodeURIComponent(uid)}?limit=${CHAT_PAGE_SIZE}`);
      if (token !== chatState.token || !Array.isArray(list)) return;
      const known = new Set(chatState.msgs.map(m => String(m.id)));
      // сообщения, которых больше нет на сервере (удалены), убираем из чата
      const fresh = new Set(list.map(m => String(m.id)));
      const minId = list.length >= CHAT_PAGE_SIZE ? Math.min(...list.map(m => Number(m.id))) : 0;
      const gone = chatState.msgs.filter(m => !m.pending && !fresh.has(String(m.id)) && Number(m.id) >= minId).map(m => m.id);
      if (gone.length) chatRemoveMsgs(gone);
      chatAppendMsgs(list.filter(m => !known.has(String(m.id))));
      // повторяем загрузку медиа, которое не удалось получить
      $('chatMessages').querySelectorAll('.chat-media[data-state="error"]').forEach(box => chatLoadMedia(box));
    } catch (e) {}
  }

  async function chatLoadOlder() {
    if (chatState.loadingOld || !chatState.hasMore || !chatState.msgs.length || !chatState.userId) return;
    const token = chatState.token;
    const uid = chatState.userId;
    const first = chatState.msgs[0];
    chatState.loadingOld = true;
    const el = $('chatMessages');
    try {
      const list = await apiGet(`/api/admin/chats/${encodeURIComponent(uid)}?before=${encodeURIComponent(first.id)}&limit=${CHAT_PAGE_SIZE}`);
      if (token !== chatState.token || !Array.isArray(list)) return;
      chatState.hasMore = list.length >= CHAT_PAGE_SIZE;
      if (!list.length) return;
      const distFromBottom = el.scrollHeight - el.scrollTop;
      chatState.msgs = list.concat(chatState.msgs);
      chatRenderAll();
      el.scrollTop = el.scrollHeight - distFromBottom;
    } catch (e) {
    } finally {
      if (token === chatState.token) chatState.loadingOld = false;
    }
  }

  function chatToast(msg) {
    const t = $('chatToast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('visible');
    clearTimeout(chatState.toastTimer);
    chatState.toastTimer = setTimeout(() => t.classList.remove('visible'), 2600);
  }
  function chatFitInput() {
    const bar = $('chatInputBar');
    const msgs = $('chatMessages');
    if (!bar || !msgs || !bar.offsetHeight) return;
    const off = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--bottom-menu-offset'), 10) || 16;
    const near = chatIsNearBottom();
    msgs.style.paddingBottom = (bar.offsetHeight + off + 12) + 'px';
    const top = $('chatTop');
    const pbar = top && top.querySelector('.chat-profile-bar');
    if (pbar && pbar.offsetHeight) {
      const bottom = pbar.getBoundingClientRect().bottom;
      msgs.style.paddingTop = (bottom + 8) + 'px';
      const blur = $('chatBlur');
      if (blur) blur.style.height = (bottom + 4) + 'px';
    }
    const bb = $('chatBlurBottom');
    if (bb) bb.style.height = Math.max(0, $('chatView').clientHeight - bar.getBoundingClientRect().top + 4) + 'px';
    if (near) chatScrollBottom();
  }
  function chatAutosize() {
    const ta = $('chatInput');
    ta.style.height = 'auto';
    const h = Math.min(ta.scrollHeight, 120);
    ta.style.height = h + 'px';
    ta.style.overflowY = ta.scrollHeight > 120 ? 'auto' : 'hidden';
    chatFitInput();
  }
  function chatFitViewport() {
    const v = $('chatView');
    if (v) { v.style.height = ''; v.style.top = ''; v.style.bottom = ''; }
  }

  async function chatSend() {
    const input = $('chatInput');
    const text = (input.value || '').trim();
    if (!text || chatState.sending || !chatState.userId) return;
    const uid = chatState.userId;
    const token = chatState.token;
    const el = $('chatMessages');
    const tmpId = 'tmp-' + Date.now();
    const tmp = { id: tmpId, direction: 'out', kind: 'text', text, created_at: new Date().toISOString(), pending: true };

    chatState.sending = true;
    input.value = '';
    chatAutosize();
    el.querySelector('.chat-empty')?.remove();
    el.insertAdjacentHTML('beforeend', chatMsgsHtml([tmp], chatLastDayKey()));
    chatTightenBubbles(el);
    chatScrollBottom();

    const restore = () => {
      el.querySelector(`[data-msg-id="${tmpId}"]`)?.remove();
      if (!input.value) input.value = text;
      chatAutosize();
    };
    try {
      const r = await apiSend('POST', `/api/admin/chats/${encodeURIComponent(uid)}/send`, { text });
      if (token !== chatState.token) return;
      if (r.ok) {
        el.querySelector(`[data-msg-id="${tmpId}"]`)?.remove();
        const m = r.data && r.data.message;
        if (m && m.id != null && !chatState.msgs.some(x => String(x.id) === String(m.id))) {
          chatAppendMsgs([{ direction: 'out', kind: 'text', text, created_at: new Date().toISOString(), ...m }]);
        }
        chatScrollBottom();
      } else {
        restore();
        chatToast((r.data && r.data.error) || 'Не удалось отправить');
      }
    } catch (e) {
      if (token === chatState.token) {
        restore();
        chatToast('Ошибка соединения');
      }
    } finally {
      chatState.sending = false;
    }
  }

  function openChatView(userId, hint) {
    if (!userId) return;
    hapticLight();
    const c = chatsList.find(x => String(x.user_id) === String(userId)) || hint || {};
    chatState.token++;
    chatState.userId = String(userId);
    chatState.user = {
      user_id: String(userId), user_name: c.user_name || hint?.user_name || '',
      user_username: c.user_username || hint?.user_username || '', photo_url: c.photo_url || ''
    };
    chatState.msgs = [];
    chatState.hasMore = true;
    chatState.loadingOld = false;
    chatState.sending = false;

    $('chatHeadAvatar').innerHTML = chatAvatarHtml(chatState.user).replace(/^<div class="chat-avatar">/, '').replace(/<\/div>$/, '');
    $('chatHeadName').textContent = chatTitle(chatState.user);
    $('chatInput').value = '';
    $('chatMessages').innerHTML = `<div class="chat-empty">Загрузка…</div>`;
    $('chatView').style.display = 'flex';
    document.body.style.overflow = 'hidden';
    chatAutosize();
    chatFitViewport();

    chatState.observer = ('IntersectionObserver' in window)
      ? new IntersectionObserver((entries) => {
          entries.forEach(en => {
            if (en.isIntersecting) {
              chatState.observer.unobserve(en.target);
              chatLoadMedia(en.target);
            }
          });
        }, { root: $('chatMessages'), rootMargin: '200px 0px' })
      : null;

    const token = chatState.token;
    apiGet(`/api/admin/chats/${encodeURIComponent(chatState.userId)}?limit=${CHAT_PAGE_SIZE}`)
      .then(list => {
        if (token !== chatState.token) return;
        chatState.msgs = Array.isArray(list) ? list : [];
        chatState.hasMore = chatState.msgs.length >= CHAT_PAGE_SIZE;
        chatRenderAll();
        chatScrollBottom();
        chatMarkRead();
      })
      .catch(() => {
        if (token !== chatState.token) return;
        $('chatMessages').innerHTML = `<div class="chat-empty">Ошибка загрузки переписки</div>`;
      })
      .finally(() => {
        if (token === chatState.token) chatStartPoll();
      });
  }

  function closeChatView(opts) {
    if (!chatState.userId) return;
    chatStopPoll();
    chatStopAudio();
    chatCloseLightbox();
    chatState.token++;
    if (chatState.observer) chatState.observer.disconnect();
    chatState.observer = null;
    chatState.blobs.forEach(u => { try { URL.revokeObjectURL(u); } catch (e) {} });
    chatState.blobs = new Map();
    chatState.pending = new Map();
    chatState.userId = null;
    chatState.user = null;
    chatState.msgs = [];
    chatState.sending = false;
    chatState.loadingOld = false;
    $('chatInput').blur();
    $('chatView').style.display = 'none';
    chatFitViewport();
    $('chatMessages').innerHTML = '';
    document.body.style.overflow = '';
    if (cur.page === 'chats') { renderChatsList(); loadChatsList(); }
  }

  function bindChatEvents() {
    const msgs = $('chatMessages');
    msgs.addEventListener('scroll', () => { if (msgs.scrollTop < 80) chatLoadOlder(); });
    $('chatInput').addEventListener('input', chatAutosize);
    $('chatInput').addEventListener('keydown', (e) => {
      const desktop = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && desktop) {
        e.preventDefault();
        chatSend();
      }
    });
    $('chatSendBtn').addEventListener('click', () => { hapticLight(); chatSend(); });
    $('chatRefreshBtn').addEventListener('click', () => {
      hapticLight();
      showTopLoader();
      Promise.resolve(chatPoll(true)).finally(hideTopLoader);
    });
    $('chatLightbox').addEventListener('click', () => chatCloseLightbox());

    // долгое нажатие на сообщение — окно с информацией
    let lpTimer = null, lpX = 0, lpY = 0;
    const lpCancel = () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } };
    msgs.addEventListener('touchstart', (e) => {
      chatState.longFired = false;
      lpCancel();
      const el = e.target.closest('.chat-msg');
      if (!el || el.classList.contains('pending') || e.touches.length !== 1) return;
      lpX = e.touches[0].clientX; lpY = e.touches[0].clientY;
      lpTimer = setTimeout(() => {
        lpTimer = null;
        chatState.longFired = true;
        chatShowMsgInfo(el.dataset.msgId);
      }, 500);
    }, { passive: true });
    msgs.addEventListener('touchmove', (e) => {
      if (!lpTimer) return;
      const t = e.touches[0];
      if (Math.abs(t.clientX - lpX) > 10 || Math.abs(t.clientY - lpY) > 10) lpCancel();
    }, { passive: true });
    msgs.addEventListener('touchend', lpCancel, { passive: true });
    msgs.addEventListener('touchcancel', lpCancel, { passive: true });
    msgs.addEventListener('scroll', lpCancel, { passive: true });
    // компьютер: правая кнопка мыши
    msgs.addEventListener('contextmenu', (e) => {
      const el = e.target.closest('.chat-msg');
      if (!el) return;
      e.preventDefault();
      if (!el.classList.contains('pending')) chatShowMsgInfo(el.dataset.msgId);
    });
    msgs.addEventListener('click', (e) => {
      // после долгого нажатия отпускание пальца не должно открывать фото/видео
      if (chatState.longFired) { chatState.longFired = false; e.preventDefault(); return; }
      const t = e.target;
      const voice = t.closest('.chat-voice');
      if (voice) { hapticLight(); chatToggleVoice(voice); return; }
      const box = t.closest('.chat-media');
      if (!box) return;
      if (box.dataset.state === 'error') { chatLoadMedia(box); return; }
      const kind = box.dataset.kind;
      if (kind === 'photo') {
        const img = box.querySelector('img');
        if (img) { hapticLight(); chatOpenLightbox(img.src); }
      } else if (kind === 'video' || kind === 'video_note') {
        const v = box.querySelector('video');
        if (box.dataset.playing === '1') {
          if (kind === 'video_note' && v) { if (v.paused) v.play().catch(() => {}); else v.pause(); }
          return;
        }
        if (box.classList.contains('loading')) return;
        hapticLight();
        chatPlayVideo(box);
      }
    });
    if ('ResizeObserver' in window) new ResizeObserver(() => chatFitInput()).observe($('chatInputBar'));
    if ('ResizeObserver' in window) new ResizeObserver(() => chatFitInput()).observe($('chatTop'));
    $('chatsContent').addEventListener('click', (e) => {
      const row = e.target.closest('.chat-row[data-chat-user]');
      if (row) openChatView(row.dataset.chatUser, { user_name: row.dataset.userName, user_username: row.dataset.userUsername });
    });
    $('statsContent').addEventListener('click', (e) => {
      const b = e.target.closest('[data-stats-mode]');
      if (!b) return;
      hapticLight();
      statsBarMode = b.dataset.statsMode;
      statsRender();
    });
    setInterval(() => {
      if (!document.hidden && cur.page === 'chats' && !chatState.userId) loadChatsList();
    }, CHAT_LIST_MS);
  }

  // =============================================
  // СТАТИСТИКА ПРИЛОЖЕНИЯ
  // =============================================
  let statsData = null;
  let statsBarMode = 'orders';
  const PAY_METHOD_NAMES = { card: 'Карта', sbp: 'СБП', wallet: 'Кошелёк', cash: 'Наличные', balance: 'Баланс' };

  function statNum(v) {
    return Math.round(Number(v) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }
  function statMoney(v) {
    return formatPrice(Number(v) || 0);
  }
  function statDayLabel(day) {
    const s = String(day || '');
    const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? `${m[3]}.${m[2]}` : s;
  }
  function statTile(label, value) {
    return `<div class="stat-tile"><div class="stat-tile-value">${value}</div><div class="stat-tile-label">${escapeHtml(label)}</div></div>`;
  }

  async function renderStatsPage() {
    const container = $('statsContent');
    if (!container) return;

    try {
      const d = await apiGet('/api/admin/stats/detailed');
      if (cur.page !== 'stats') return;
      statsData = d || {};
      statsRender();
    } catch (e) {
      if (cur.page !== 'stats') return;
      if (!statsData) container.innerHTML = `<div class="stat-empty">Ошибка загрузки статистики</div>`;

  function statsRender() {
    const container = $('statsContent');
    if (!container || !statsData) return;
    const d = statsData;
    const t = d.totals || {};
    const days = Array.isArray(d.byDay) ? d.byDay : [];
    const pays = Array.isArray(d.byPayment) ? d.byPayment : [];
    const products = (Array.isArray(d.topProducts) ? d.topProducts : []).slice(0, 10);
    const hours = Array(24).fill(0);
    (Array.isArray(d.byHour) ? d.byHour : []).forEach(h => {
      const i = Number(h.hour);
      if (i >= 0 && i < 24) hours[i] += Number(h.orders) || 0;
    });

    const isRev = statsBarMode === 'revenue';
    const vals = days.map(x => Number(isRev ? x.revenue : x.orders) || 0);
    const max = Math.max(0, ...vals);
    const sumOrders = days.reduce((s, x) => s + (Number(x.orders) || 0), 0);
    const sumRevenue = days.reduce((s, x) => s + (Number(x.revenue) || 0), 0);
    const barsHtml = days.length && max > 0
      ? `<div class="stat-bars">${days.map((x, i) => {
          const v = vals[i];
          const label = `${statDayLabel(x.day)}: ${isRev ? statMoney(v) : statNum(v) + ' зак.'}`;
          const h = v > 0 ? Math.max((v / max) * 100, 3) : 0;
          return `<div class="stat-bar-col" title="${escapeHtml(label)}"><div class="stat-bar${v > 0 ? '' : ' zero'}" style="height:${h}%"></div></div>`;
        }).join('')}</div>
        <div class="stat-bars-axis"><span>${escapeHtml(days.length ? statDayLabel(days[0].day) : '')}</span><span>${escapeHtml(days.length ? statDayLabel(days[days.length - 1].day) : '')}</span></div>`
      : `<div class="stat-empty">Нет данных за период</div>`;

    const payTotalCount = pays.reduce((s, p) => s + (Number(p.count) || 0), 0);
    const paysHtml = pays.length
      ? pays.map(p => {
          const name = PAY_METHOD_NAMES[p.method] || p.method || 'Не указан';
          const share = payTotalCount ? (Number(p.count) || 0) / payTotalCount * 100 : 0;
          return `<div class="stat-row"><div class="stat-row-main"><div class="stat-row-name">${escapeHtml(name)}</div>
            <div class="stat-row-sub">${statNum(p.count)} зак. · ${share.toFixed(0)}%</div>
            <div class="stat-share"><span style="width:${share.toFixed(1)}%"></span></div></div>
            <div class="stat-row-val">${statMoney(p.revenue)}</div></div>`;
        }).join('')
      : `<div class="stat-empty">Нет данных</div>`;

    const productsHtml = products.length
      ? products.map((p, i) => `<div class="stat-row"><div class="stat-rank">${i + 1}</div>
            <div class="stat-row-main"><div class="stat-row-name">${escapeHtml(p.name || 'Товар')}</div>
            <div class="stat-row-sub">${statNum(p.qty)} шт.</div></div>
            <div class="stat-row-val">${statMoney(p.revenue)}</div></div>`).join('')
      : `<div class="stat-empty">Нет данных</div>`;

    const hMax = Math.max(0, ...hours);
    const hoursHtml = `<div class="stat-hours">${hours.map((v, h) => {
        const bg = v > 0 && hMax > 0 ? ` style="background:rgba(76,180,233,${(0.15 + 0.85 * v / hMax).toFixed(2)})"` : '';
        return `<div class="stat-hour"${bg} title="${String(h).padStart(2, '0')}:00 — ${statNum(v)} зак.">${String(h).padStart(2, '0')}</div>`;
      }).join('')}</div>
      ${hMax > 0 ? '' : `<div class="stat-empty">Нет данных</div>`}`;

    container.innerHTML = `
        <div class="stats-grid">
            ${statTile('Заказов', statNum(t.orders))}
            ${statTile('Выполнено', statNum(t.completed))}
            ${statTile('Отменено', statNum(t.cancelled))}
            ${statTile('Выручка', statMoney(t.revenue))}
            ${statTile('Средний чек', statMoney(t.avgCheck))}
            ${statTile('Пользователей', statNum(t.users))}
            ${statTile('Новых за 7 дней', statNum(t.newUsers7d))}
            ${statTile('Рефералов', statNum(t.referrals))}
            ${statTile('Баланс кошельков', statMoney(t.walletsTotal))}
            ${statTile('Выплачено кэшбэка', statMoney(t.cashbackPaid))}
        </div>
        <div class="stat-card">
            <div class="stat-card-head">
                <div class="stat-card-title">По дням</div>
                <div class="stat-seg">
                    <button type="button" data-stats-mode="orders" class="${isRev ? '' : 'active'}">Заказы</button>
                    <button type="button" data-stats-mode="revenue" class="${isRev ? 'active' : ''}">Выручка</button>
                </div>
            </div>
            <div class="stat-card-sub">За 30 дней: ${statNum(sumOrders)} зак. на ${statMoney(sumRevenue)}</div>
            ${barsHtml}
        </div>
        <div class="stat-card">
            <div class="stat-card-title" style="margin-bottom:6px;">Способы оплаты</div>
            ${paysHtml}
        </div>
        <div class="stat-card">
            <div class="stat-card-title" style="margin-bottom:6px;">Топ-10 товаров</div>
            ${productsHtml}
        </div>
        <div class="stat-card">
            <div class="stat-card-title" style="margin-bottom:12px;">Активность по часам</div>
            ${hoursHtml}
        </div>
        <div class="list-bottom-space"></div>`;
  }

  let promosData = [];

  function promoIsActive(p) {
    const isExpired = p.expires_at && new Date(p.expires_at) < new Date();
    const isLimitReached = p.max_uses !== null && p.max_uses !== undefined && p.used_count >= p.max_uses;
    return !!p.active && !isExpired && !isLimitReached;
  }

  // «ЧЧ:ММ ДД.ММ.ГГ» по МСК — как дата в карточке заказа
  function fmtMsk(v) {
    if (!v) return '—';
    const d = new Date(v);
    if (isNaN(d)) return '—';
    const parts = new Intl.DateTimeFormat('ru-RU', { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: '2-digit', hour12: false }).formatToParts(d);
    const g = (t) => parts.find(x => x.type === t)?.value || '';
    return `${g('hour')}:${g('minute')} ${g('day')}.${g('month')}.${g('year')}`;
  }

  function showPromoInfoAlert(p) {
    if (!p) return;
    const message =
      `Информация о промокоде:\n\n` +
      `Промокод: ${truncate(p.code, 40)}\n` +
      (p.user_id ? `Для: ${p.user_id}\n` : '') +
      `Процент скидки: ${p.discount}%\n` +
      `Создан: ${fmtMsk(p.created_at)}\n` +
      `Действует: ${p.type === 'first_order' ? 'Первый заказ' : 'Все заказы'}\n` +
      `Срок действия: ${p.expires_at ? fmtMsk(p.expires_at) : '∞'}\n` +
      `Использований: ${p.used_count || 0}/${p.max_uses ? p.max_uses : '∞'}`;
    showPopup({
      message,
      buttons: [
        { id: 'delete_promo', type: 'destructive', text: 'Удалить' },
        { id: 'close', type: 'close' }
      ]
    }, (buttonId) => { if (buttonId === 'delete_promo') deletePromo(p.id); });
  }

    if (sel) {
      sel.innerHTML = [
        { key: 'all', label: `Все промокоды (${promosData.length})` },
        { key: 'active', label: `Активные (${activeN})` },
        { key: 'inactive', label: `Не активные (${promosData.length - activeN})` },
        { key: 'create', label: 'Создать промокод' }
      ].map(o => `<option value="${o.key}" ${promosFilter === o.key ? 'selected' : ''}>${o.label}</option>`).join('');
    }
    const list = $('promosList');
    if (!list) return;
    let filtered = promosData;
    if (promosFilter === 'active') filtered = filtered.filter(promoIsActive);
    if (promosFilter === 'inactive') filtered = filtered.filter(p => !promoIsActive(p));
    const q = promosSearch.trim().toLowerCase();
    if (q) filtered = filtered.filter(p => String(p.code || '').toLowerCase().includes(q));
    if (!promosData.length) { list.innerHTML = `<div class="empty-message"><div class="empty-title">Промокодов нет</div></div>`; return; }
    if (!filtered.length) { list.innerHTML = `<div class="empty-message"><div class="empty-title">Промокоды не найдены</div></div>`; return; }
    list.innerHTML = filtered.map(p => {
      const active = promoIsActive(p);
      let expiresStr = '∞';
      if (p.expires_at) expiresStr = fmtMsk(p.expires_at);
      const uses = p.max_uses ? `${p.used_count || 0}/${p.max_uses}` : `${p.used_count || 0}/∞`;
      return `<div class="order-wrapper">
          <div class="order-main-card" style="cursor:default;">
              <div class="order-header">
                  <span class="order-id">${escapeHtml(p.code)}</span>
                  <div class="order-header-right">
                      <span class="order-card-status ${active ? 'status-completed-text status-completed-bg' : 'status-cancelled-text status-cancelled-bg'}">${active ? 'Активен' : 'Не активен'}</span>
                  </div>
              </div>
              <div class="order-date">${escapeHtml(fmtMsk(p.created_at))}</div>
              <div class="order-total">−${p.discount}%</div>
              <svg class="icon icon-info-order-status icon--accent order-status-info-icon" data-promo-info="${p.id}"><use href="#icon-info"></use></svg>
          </div>
          <div class="order-items-card">
              <div class="order-item-row"><span class="order-item-name">Использований</span><span class="order-item-price">${uses}</span></div>
              <div class="order-item-row"><span class="order-item-name">Срок действия</span><span class="order-item-price">${expiresStr}</span></div>
          </div>
      </div>`;
    }).join('');
  }

  async function renderPromosPage() {
    hideFixedBar();
    if (promosLoaded) renderPromosView();
    try {
      promosData = await apiGet('/api/promo-codes');
      promosLoaded = true;
      if (cur.page === 'promos') renderPromosView();
    } catch (e) {
      if (!promosLoaded && $('promosContent')) $('promosContent').innerHTML = `<div class="empty-message"><div class="empty-title">Ошибка загрузки</div></div>`;
    }
  }

  function deletePromo(id) {
    hapticLight();
    showPopup({
      message: 'Удалить промокод?',
      buttons: [{ id: 'ok', type: 'destructive', text: 'Удалить' }, { id: 'cancel', type: 'cancel' }]
    }, async (buttonId) => {
      if (buttonId !== 'ok') return;
      try {
        const r = await apiSend('DELETE', `/api/promo-codes/${id}/delete`);
        if (r.ok) { hapticLight(); renderPromosPage(); } else showAppAlert('Ошибка удаления');
      } catch (e) { showAppAlert('Ошибка соединения'); }
    });
  }

  function renderCreatePromoPage() {
    const container = $('createPromoContent');
    if (!container) return;
    container.innerHTML = `
        <div class="content-card" style="margin-bottom:110px;">
            <div class="form-stack">
                <input id="promoCode" class="form-input" placeholder="Введите промокод">
                <input id="promoDiscount" class="form-input" type="number" placeholder="Процент скидки" min="1" max="100">
                <select id="promoType" class="form-select-native">
                    <option value="all">Все заказы</option>
                    <option value="first_order">Первый заказ</option>
                </select>
                <input id="promoUserId" class="form-input" placeholder="ID пользователя (необязательно)">
                <input id="promoExpires" class="form-input" placeholder="Срок действия: 14:08 21.06 (МСК)">
                <input id="promoMaxUses" class="form-input" type="number" placeholder="Количество активаций (необязательно)" min="1">
            </div>
        </div>`;
    showFixedBar(`<div class="checkout-card"><div class="checkout-buttons-row"><button class="checkout-button" id="createPromoSubmitBtn">Создать промокод</button></div></div>`);
    $('createPromoSubmitBtn')?.addEventListener('click', async () => {
      hapticMedium();
      const code = $('promoCode')?.value.trim();
      const discount = $('promoDiscount')?.value;
      const type = $('promoType')?.value;
      const userId = $('promoUserId')?.value.trim();
      const expiresRaw = $('promoExpires')?.value.trim();
      const maxUses = $('promoMaxUses')?.value;
      if (!code || !discount) { showAppAlert('Введите код и скидку'); return; }
      let expiresAt = null;
      if (expiresRaw) {
        try {
          const [timePart, datePart] = expiresRaw.split(' ');
          const [hh, mm] = timePart.split(':').map(Number);
          const [dd, mo] = datePart.split('.').map(Number);
          if ([hh, mm, dd, mo].some(isNaN)) throw new Error('bad');
          expiresAt = new Date(Date.UTC(new Date().getFullYear(), mo - 1, dd, hh - 3, mm)).toISOString();
        } catch (e) { showAppAlert('Неверный формат срока. Используйте: 14:08 21.06'); return; }
      }
      try {
        const r = await apiSend('POST', '/api/promo-codes', { code, discount: parseInt(discount), type, userId: userId || null, expiresAt, maxUses: maxUses || null });
        if (r.ok) { hapticLight(); goBack(); }
        else showAppAlert((r.data && r.data.error) || 'Ошибка создания');
      } catch (e) { showAppAlert('Ошибка соединения'); }
    });
  }


  // =============================================
  // ОБНОВЛЕНИЕ ТЕКУЩЕЙ СТРАНИЦЫ
  // =============================================
  async function refreshCurrentPage() {
    if (chatState.userId) return chatPoll(true);
    switch (cur.page) {
      case 'order':
        await loadOrders();                       // свежие данные заказа (смена статуса и т.п.)
        return renderOrderDetailPage(cur.params.id);
      case 'users':
        return renderUsersPage();
      case 'reviews':
        return renderReviewsPage();
      case 'promos':
        return renderPromosPage();
      default:
        return renderCurrent({ fromBack: true });
    }
  }

  // =============================================
  // ДЕЛЕГИРОВАННЫЕ СОБЫТИЯ
  // =============================================
  let profileLongPressFiredAt = 0;

  document.addEventListener('click', (e) => {
    const t = e.target;

    // шапка: обновить / тема
    const dbl = t.closest('#headerDoubleBtn');
    if (dbl) {
      const rect = dbl.getBoundingClientRect();
      if (e.clientX < rect.left + rect.width / 2) {
        hapticLight();
        showTopLoader();
        Promise.resolve(refreshCurrentPage()).finally(hideTopLoader);
      } else {
        toggleAppTheme();
        if (cur.page === 'settings') renderSettingsPage();
      }
      return;
    }

    // информация о статусе заказа
    const info = t.closest('[data-status-info]');
    if (info) {
      e.stopPropagation();
      const o = allOrders.find(x => String(x.id) === String(info.dataset.statusInfo));
      if (o) { hapticLight(); showOrderStatusInfo(o); }
      return;
    }

    // открыть заказ
    const oc = t.closest('[data-open-order]');
    if (oc) {
      const o = allOrders.find(x => String(x.id) === String(oc.dataset.openOrder));
      if (o) { hapticLight(); openPage('order', { id: o.id, number: o.order_number }); }
      return;
    }

    // покупатель в заказе
    const buyer = t.closest('#orderBuyerLink');
    if (buyer) {
      openUserPage(buyer.dataset.userId, { user_name: buyer.dataset.userName });
      return;
    }

    // бейдж заказа в отзыве
    const ob = t.closest('.review-order-badge');
    if (ob) { hapticLight(); openOrderByNumber(ob.dataset.orderNum); return; }

    // бейдж оценки (удаление отзыва)
    const rb = t.closest('.review-rating-badge');
    if (rb) { confirmDeleteReview(rb.dataset.reviewId); return; }

    // имя автора отзыва → страница пользователя
    const an = t.closest('.review-author-name[data-user-id]');
    if (an) { openUserPage(an.dataset.userId, { user_name: an.textContent.trim() }); return; }

    // переход на пользователя (операции кошелька, рефералы, список)
    const gu = t.closest('[data-goto-user]');
    if (gu) { openUserPage(gu.dataset.gotoUser, { user_name: gu.dataset.userName }); return; }

    // удаление операции кошелька на странице пользователя
    const tx = t.closest('[data-tx-id]');
    if (tx) {
      const id = tx.dataset.txId;
      hapticLight();
      showPopup({
        title: 'Удалить операцию?',
        message: 'Операция будет удалена из истории пользователя.',
        buttons: [{ id: 'del', type: 'destructive', text: 'Удалить' }, { type: 'cancel' }]
      }, async (btn) => {
        if (btn !== 'del') return;
        const r = await apiSend('DELETE', `/api/wallet-transactions/${encodeURIComponent(id)}`);
        if (r.ok) rerenderCurrent(); else showAppAlert('Не удалось удалить операцию');
      });
      return;
    }

    // удаление промокода
    const pi = t.closest('[data-promo-info]');
    if (pi) {
      const p = promosData.find(x => String(x.id) === String(pi.dataset.promoInfo));
      if (p) { hapticLight(); showPromoInfoAlert(p); }
      return;
    }

    // показать всех пользователей
    if (t.closest('#usersShowAllBtn')) { hapticLight(); usersShowAll = true; renderUsersView(); return; }

    // очистка полей поиска
    if (t.closest('#orderSearchClearBtn')) {
      const i = $('orderSearchInput'); i.value = ''; $('orderSearchClearBtn').classList.remove('visible'); applyOrdersFilters(); return;
    }
    if (t.closest('#userSearchClearBtn')) {
      usersSearch = ''; $('userSearchInput').value = ''; $('userSearchClearBtn').classList.remove('visible'); renderUsersView(); return;
    }
    if (t.closest('#chatsSearchClearBtn')) {
      chatsSearch = ''; $('chatsSearchInput').value = ''; $('chatsSearchClearBtn').classList.remove('visible'); renderChatsList(); return;
    }
    if (t.closest('#promoSearchClearBtn')) {
      promosSearch = ''; $('promoSearchInput').value = ''; $('promoSearchClearBtn').classList.remove('visible'); renderPromosView(); return;
    }
    if (t.closest('#reviewSearchClearBtn')) {
      reviewsSearch = ''; $('reviewSearchInput').value = ''; $('reviewSearchClearBtn').classList.remove('visible'); renderReviewsView(); return;
    }

    // нижнее меню
    const mi = t.closest('.menu-item[data-page]');
    if (mi) {
      if (Date.now() - profileLongPressFiredAt < 600) { e.preventDefault(); return; }
      hapticLight();
      const p = mi.dataset.page;
      if (menuPageFor(cur.page) === p && cur.page === p) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      openPage(p, {}, { reset: true });
    }
  });

  document.addEventListener('input', (e) => {
    const id = e.target.id;
    if (id === 'orderSearchInput') {
      $('orderSearchClearBtn')?.classList.toggle('visible', !!e.target.value);
      applyOrdersFilters();
    } else if (id === 'chatsSearchInput') {
      chatsSearch = e.target.value;
      $('chatsSearchClearBtn')?.classList.toggle('visible', !!chatsSearch);
      renderChatsList();
    } else if (id === 'userSearchInput') {
      usersSearch = e.target.value; usersShowAll = false;
      $('userSearchClearBtn')?.classList.toggle('visible', !!usersSearch);
      renderUsersView();
    } else if (id === 'promoSearchInput') {
      promosSearch = e.target.value;
      $('promoSearchClearBtn')?.classList.toggle('visible', !!promosSearch);
      renderPromosView();
    } else if (id === 'reviewSearchInput') {
      reviewsSearch = e.target.value;
      $('reviewSearchClearBtn')?.classList.toggle('visible', !!reviewsSearch);
      renderReviewsView();
    }
  });

  document.addEventListener('change', (e) => {
    const id = e.target.id;
    const v = e.target.value;
    if (id === 'pageHeaderNavSelect') {
      if (!v) return;
      hapticLight();
      if (chatState.userId && v === 'chats') { closeChatView(); return; }
      if (cur.page === 'user') { setUserTab(v, { scroll: true }); return; }
      if (v === cur.page) return;
      openPage(v, {}, MAIN_PAGES.includes(v) ? { reset: true } : {});
    } else if (id === 'orderStatusSelect') {
      ordersStatusFilter = v; hapticLight(); applyOrdersFilters();
    } else if (id === 'chatsFilterSelect') {
      chatsFilter = v; hapticLight(); renderChatsList();
    } else if (id === 'userStatusFilterSelect') {
      usersFilter = v; usersShowAll = false; hapticLight(); renderUsersView();
    } else if (id === 'promoFilterSelect') {
      hapticLight();
      if (v === 'create') { e.target.value = promosFilter; openPage('create-promo'); return; }
      promosFilter = v; renderPromosView();
    } else if (id === 'reviewGameSelect') {
      reviewsFilter = v; hapticLight(); renderReviewsView();
    }
  });

  // долгое нажатие на круглую кнопку профиля → информация о магазине (без перехода на страницу)
  (function bindProfileLongPress() {
    const btn = $('profileMenuBtn');
    if (!btn) return;
    let timer = null, sx = 0, sy = 0, fired = false;
    const cancel = () => { clearTimeout(timer); timer = null; };
    const release = () => { cancel(); if (fired) { fired = false; profileLongPressFiredAt = Date.now(); } };
    btn.addEventListener('pointerdown', (e) => {
      sx = e.clientX; sy = e.clientY;
      cancel();
      timer = setTimeout(() => {
        timer = null;
        if (cur.page === 'settings') return;
        fired = true;
        profileLongPressFiredAt = Date.now();
        hapticMedium();
        showStoreInfoAlert();
      }, 350);
    });
    btn.addEventListener('pointermove', (e) => { if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel(); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btn.addEventListener(ev, release));
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  })();

  // =============================================
  // ИНИЦИАЛИЗАЦИЯ
  // =============================================
  (function initApp() {
    const tg = window.Telegram?.WebApp;
    if (tg) {
      try { tg.ready(); tg.expand(); } catch (e) {}
      try { if ((localStorage.getItem('appFormat') || 'fullscreen') === 'fullscreen') tg.requestFullscreen(); } catch (e) {}
      try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
      try { tg.disableClosingConfirmation && tg.disableClosingConfirmation(); } catch (e) {}
      try { tg.BackButton.onClick(goBack); } catch (e) {}
      const photo = tg.initDataUnsafe?.user?.photo_url;
      if (photo && $('profileMenuAvatar')) $('profileMenuAvatar').src = photo;
    }
    applyTheme(localStorage.getItem('appTheme') || 'dark');
    applyBottomMenuOffset(getBottomMenuOffset());
    window.addEventListener('resize', () => updateMenuSlider(menuPageFor(cur.page)));
    setInterval(() => { if (!document.hidden && cur.page === 'orders') loadOrders(); }, 30000);
    bindChatEvents();

    openPage('orders');
    $('bottomMenuWrapper').style.opacity = '1';
    updateMenuState();
  })();

})();
</script>
</body>
