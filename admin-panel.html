    <div id="profileMenuWrapper" style="position:relative;height:67px;width:67px;flex:none;">
        <div style="position:absolute;inset:0;background:var(--sticky-bg);border:1px solid var(--bottom-menu-border);border-radius:50%;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:1;"></div>
        <button class="menu-item" data-page="profile" id="profileMenuBtn" style="position:absolute;inset:0;margin:auto;width:57px;height:57px;min-width:56px;min-height:56px;border-radius:50%;border:none;padding:0;overflow:hidden;background:transparent;z-index:3;display:flex;align-items:center;justify-content:center;">
            <img id="profileMenuAvatar" style="width:100%;height:100%;aspect-ratio:1/1;object-fit:cover;border-radius:50%;background:var(--input-bg-dark);">
        </button>
    </div>
</div>

<script>
['log','warn','error','info','debug','table','trace'].forEach(m => console[m] = () => {});

(function() {
  const origFetch = window.fetch.bind(window);
  window.fetch = function(input, init) {
    try {
      const url = typeof input === 'string' ? input : input.url;
      const token = sessionStorage.getItem('adminSessionToken');
      if (token && url && url.indexOf('placedgames.up.railway.app') !== -1) {
        init = init || {};
        const headers = new Headers(init.headers || {});
        if (!headers.has('Authorization')) headers.set('Authorization', `Bearer ${token}`);
        init.headers = headers;
      }
    } catch (e) {}
    return origFetch(input, init);
  };
})();

(async function() {
  if (!window.Telegram?.WebApp?.initData) {
    document.body.innerHTML = '';
    return;
  }
  const tg = window.Telegram.WebApp;
  try {
    const res = await fetch('https://placedgames.up.railway.app/api/admin/verify-telegram', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData })
    });
    const data = await res.json();
    if (!data.success) {
      document.body.innerHTML = `<div style="color:white;text-align:center;margin-top:40vh;font-size:20px;padding:20px;">Проверка не пройдена<br><span style="font-size:14px;color:#9e9e9e;">${escapeHtml(data.reason || '')}</span></div>`;
      return;
    }
    sessionStorage.setItem('adminSessionToken', data.sessionToken);
  } catch (e) {
    document.body.innerHTML = `<div style="color:white;text-align:center;margin-top:40vh;font-size:20px;padding:20px;">Ошибка проверки<br><span style="font-size:14px;color:#9e9e9e;">${escapeHtml(e.message)}</span></div>`;
    return;
  }
  const loader = document.getElementById('loaderOverlay');
  if (loader) loader.style.display = 'none';

  // =============================================
  // БАЗОВЫЕ УТИЛИТЫ
  // =============================================
  const API = 'https://placedgames.up.railway.app';
  const $ = (id) => document.getElementById(id);

  function getAdminToken() {
    return sessionStorage.getItem('adminSessionToken') || '';
  }

  async function apiGet(path) {
    const r = await fetch(API + path, { cache: 'no-store', headers: { 'Authorization': `Bearer ${getAdminToken()}` } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  async function apiSend(method, path, body) {
    const r = await fetch(API + path, {
      method, cache: 'no-store',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getAdminToken()}` },
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    let data = null;
    try { data = await r.json(); } catch (e) {}
    return { ok: r.ok, status: r.status, data };
  }

  function formatPrice(p) {
    return Math.round(Number(p) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + "₽";
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  }

  function pluralizeTovar(n) {
    const n100 = n % 100;
    const n10 = n % 10;
    if (n100 >= 11 && n100 <= 14) return 'товаров';
    if (n10 === 1) return 'товар';
    if (n10 >= 2 && n10 <= 4) return 'товара';
    return 'товаров';
  }

  function pluralizePixels(n) {
    const n100 = n % 100;
    const n10 = n % 10;
    if (n100 >= 11 && n100 <= 14) return 'пикселей';
    if (n10 === 1) return 'пиксель';
    if (n10 >= 2 && n10 <= 4) return 'пикселя';
    return 'пикселей';
  }

  // ----- вибрация (как на фронтенде) -----
  function isVibrationEnabled() {
    return localStorage.getItem('vibrationEnabled') !== 'false';
  }
  function hapticLight() {
    if (!isVibrationEnabled()) return;
    if (window.Telegram?.WebApp?.HapticFeedback) { window.Telegram.WebApp.HapticFeedback.impactOccurred("light"); return; }
    if (navigator.vibrate) navigator.vibrate(30);
  }
  function hapticMedium() {
    if (!isVibrationEnabled()) return;
    if (window.Telegram?.WebApp?.HapticFeedback) { window.Telegram.WebApp.HapticFeedback.impactOccurred("medium"); return; }
    if (navigator.vibrate) navigator.vibrate(60);
  }

  // ----- алерты -----
  function showAppAlert(message) {
    if (window.__alertOpen) return;
    window.__alertOpen = true;
    const release = () => { window.__alertOpen = false; };
    if (window.Telegram?.WebApp?.showAlert) {
      try { window.Telegram.WebApp.showAlert(String(message).slice(0, 1024), release); }
      catch (e) { release(); }
    } else {
      window.alert(message);
      release();
    }
  }

  // Обёртка над showPopup: не даёт открыть два попапа сразу, режет текст до лимита Telegram (256)
  function showPopup(params, cb) {
    if (window.__popupOpen) return;
    const p = Object.assign({}, params);
    if (p.message && p.message.length > 256) p.message = p.message.slice(0, 255) + '…';
    const tg = window.Telegram?.WebApp;
    if (tg?.showPopup) {
      window.__popupOpen = true;
      try {
        tg.showPopup(p, (id) => { window.__popupOpen = false; if (cb) cb(id); });
      } catch (e) { window.__popupOpen = false; }
    } else {
      showAppAlert(p.message || '');
    }
  }

  function truncate(str, n) {
    str = String(str || '');
    return str.length > n ? str.slice(0, n - 1) + '…' : str;
  }

  // ----- верхний индикатор загрузки (белый, как на фронтенде) -----
  function isTgFullscreen() {
    const tg = window.Telegram?.WebApp;
    if (tg && typeof tg.isFullscreen === 'boolean') return tg.isFullscreen;
    return (localStorage.getItem('appFormat') || 'fullscreen') === 'fullscreen';
  }
  function showTopLoader() {
    if (!isTgFullscreen()) return;
    $('tgTopLoader')?.classList.add('visible');
  }
  function hideTopLoader() {
    $('tgTopLoader')?.classList.remove('visible');
  }
  let topLoaderDepth = 0;
  async function runWithLoader(taskFn, delayMs = 2000) {
    topLoaderDepth++;
    const timer = setTimeout(showTopLoader, delayMs);
    try {
      return await taskFn();
    } finally {
      clearTimeout(timer);
      topLoaderDepth--;
      if (topLoaderDepth <= 0) { topLoaderDepth = 0; hideTopLoader(); }
    }
  }

  // ----- тема / формат / отступ меню -----
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('appTheme', theme);
    const tg = window.Telegram?.WebApp;
    if (tg) {
      const c = theme === 'light' ? '#EFEFF3' : '#111112';
      try { tg.setHeaderColor(c); } catch (e) {}
      try { tg.setBackgroundColor(c); } catch (e) {}
    }
  }
  function themeIconRotationDeg(theme) { return theme === 'light' ? 180 : 0; }
  function updateThemeIconRotations(theme) {
    const deg = themeIconRotationDeg(theme);
    document.querySelectorAll('.theme-icon-rotatable').forEach(icon => {
      icon.style.transform = `rotate(${deg}deg)`;
      icon.dataset.rotation = deg;
    });
  }
  function toggleAppTheme() {
    hapticLight();
    const current = localStorage.getItem('appTheme') || 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    updateThemeIconRotations(next);
  }
  function getBottomMenuOffset() { return parseInt(localStorage.getItem('bottomMenuOffset') || '16', 10); }
  function applyBottomMenuOffset(offset) {
    document.documentElement.style.setProperty('--bottom-menu-offset', offset + 'px');
    localStorage.setItem('bottomMenuOffset', String(offset));
  }
  function applyAppFormat(format) {
    localStorage.setItem('appFormat', format);
    const tg = window.Telegram?.WebApp;
    if (!tg) return;
    try {
      if (format === 'fullscreen') tg.requestFullscreen();
      else if (tg.exitFullscreen) tg.exitFullscreen();
    } catch (e) {}
  }
  function clearAppCache() { location.reload(); }

  // =============================================
  // ЗАКРЕПЛЁННЫЙ БЛОК (как #cartCheckoutFixed на фронтенде)
  // =============================================
  function showFixedBar(html) {
    const el = $('cartCheckoutFixed');
    if (!el) return;
    el.innerHTML = html;
    el.style.display = 'block';
  }
  function hideFixedBar() {
    const el = $('cartCheckoutFixed');
    if (!el) return;
    el.style.display = 'none';
    el.innerHTML = '';
  }

  // =============================================
  // ШАПКА СТРАНИЦЫ (1в1 с фронтендом)
  // =============================================
  const NAV_PAGES = [
    { id: 'orders', title: 'Заказы' },
    { id: 'chats', title: 'Чаты' },
    { id: 'users', title: 'Пользователи' },
    { id: 'profile', title: 'Профиль' },
    { id: 'wallet', title: 'Кошелёк' },
    { id: 'settings', title: 'Настройки' }
  ];
  const USER_TABS = [
    { id: 'wallet', title: 'Кошелёк' },
    { id: 'orders', title: 'Заказы' },
    { id: 'reviews', title: 'Отзывы' },
    { id: 'referrals', title: 'Рефералы' }
  ];

  function renderPageHeader(title, navOptionsHtml) {
    const headerThemeDeg = themeIconRotationDeg(localStorage.getItem('appTheme') || 'dark');
    return `<div class="page-header-sticky">
<div class="page-header-inner">
    <div class="page-header-title-btn" style="cursor:pointer;position:relative;overflow:hidden;">
        <div class="page-header-icon-wrap">
            <svg class="icon icon-header-title icon--accent"><use href="#icon-logo"></use></svg>
        </div>
        <span>${escapeHtml(title)}</span>
        <select id="pageHeaderNavSelect" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px;">${navOptionsHtml}</select>
    </div>
    <button class="page-header-double-btn" id="headerDoubleBtn" style="height: 45px; background: var(--header-btn-bg); border: 1px solid var(--border-color); border-radius: 50px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; cursor: pointer;">
        <svg id="headerRefreshIcon" class="icon icon-header-refresh icon--accent"><use href="#icon-refresh"></use></svg>
        <svg id="headerThemeIcon" class="icon icon-header-theme icon--accent theme-icon-rotatable" data-rotation="${headerThemeDeg}" style="transform:rotate(${headerThemeDeg}deg);"><use href="#icon-theme"></use></svg>
    </button>
</div>
</div>`;
  }

  const PAGE_TITLES = {
    orders: 'Заказы', users: 'Пользователи', reviews: 'Отзывы', profile: 'Профиль',
    wallet: 'Кошелёк', settings: 'Настройки', promos: 'Промокоды', 'create-promo': 'Создать промокод',
    chats: 'Чаты', stats: 'Статистика'
  };

  function injectPageHeader() {
    const page = document.querySelector('.page.active-page');
    if (!page) return;
    document.querySelectorAll('.page-header-sticky').forEach(el => el.remove());

    let title, optionsHtml;
    if (cur.page === 'user') {
      // Список: ник (нельзя выбрать) + Кошелёк / Заказы / Отзывы / Рефералы
      title = cur.params.name || 'Пользователь';
      optionsHtml = `<option value="" disabled>${escapeHtml(title)}</option>` +
        USER_TABS.map(t => `<option value="${t.id}" ${t.id === (cur.params.tab || 'wallet') ? 'selected' : ''}>${t.title}</option>`).join('');
    } else {
      title = cur.page === 'order' ? `Заказ #${cur.params.number || ''}` : (PAGE_TITLES[cur.page] || '');
      const isKnown = NAV_PAGES.some(p => p.id === cur.page);
      optionsHtml = `<option value="" disabled ${!isKnown ? 'selected' : ''}>Выберите страницу</option>` +
        NAV_PAGES.map(p => `<option value="${p.id}" ${p.id === cur.page ? 'selected' : ''}>${p.title}</option>`).join('');
    }
    page.insertAdjacentHTML('afterbegin', renderPageHeader(title, optionsHtml));
  }

  // =============================================
  // НАВИГАЦИЯ (история для кнопки «Назад»)
  // =============================================
  const PAGE_DOM = {
    orders: 'orders-page', users: 'users-page', reviews: 'reviews-page', profile: 'profile-page',
    wallet: 'wallet-page', settings: 'settings-page', order: 'order-detail-page', user: 'user-detail-page',
    promos: 'promos-page', 'create-promo': 'create-promo-page', chats: 'chats-page', stats: 'stats-page'
  };
  const MAIN_PAGES = ['orders', 'chats', 'users', 'profile'];
  const PROFILE_LINKED = ['wallet', 'settings', 'promos', 'create-promo', 'reviews', 'stats'];

  let cur = { page: null, params: {} };
  let navStack = [];

  function sameState(a, b) {
    return a.page === b.page && JSON.stringify(a.params) === JSON.stringify(b.params);
  }

  function menuPageFor(page) {
    if (page === 'order') return 'orders';
    if (page === 'user') return 'users';
    if (PROFILE_LINKED.includes(page)) return 'profile';
    return page;
  }

  function updateMenuSlider(pageId) {
    const slider = $('menuSlider');
    const wrapper = $('bottomMenuWrapper');
    const pill = $('menuPill');
    const profileCircle = $('profileMenuWrapper');
    if (!slider || !wrapper || !pill || !profileCircle) return;
    const wrapperRect = wrapper.getBoundingClientRect();

    if (pageId === 'profile') {
      const circleRect = profileCircle.getBoundingClientRect();
      slider.style.opacity = '1';
      slider.style.left = (circleRect.left - wrapperRect.left + 4) + 'px';
      slider.style.width = (circleRect.width - 8) + 'px';
      slider.style.borderRadius = '50%';
      return;
    }
    const pages = ['orders', 'chats', 'users'];
    const index = pages.indexOf(pageId);
    if (index === -1) { slider.style.opacity = '0'; return; }
    const pillRect = pill.getBoundingClientRect();
    const segmentWidth = (pillRect.width - 8) / 3;
    slider.style.opacity = '1';
    slider.style.left = (pillRect.left - wrapperRect.left + 4 + index * segmentWidth) + 'px';
    slider.style.width = segmentWidth + 'px';
    slider.style.borderRadius = '50px';
  }

  function updateMenuState() {
    const menuPage = menuPageFor(cur.page);
    document.querySelectorAll('.menu-item').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`.menu-item[data-page="${menuPage}"]`)?.classList.add('active');
    $('profileMenuWrapper')?.classList.toggle('active', menuPage === 'profile');
    updateMenuSlider(menuPage);
  }

  function updateBackButton() {
    const bb = window.Telegram?.WebApp?.BackButton;
    if (!bb) return;
    if (cur.page === 'orders' && navStack.length === 0) bb.hide(); else bb.show();
  }

  function openPage(page, params = {}, opts = {}) {
    hideFixedBar();
    closeChatView({ skipHeader: true });
    const next = { page, params };
    if (!opts.fromBack && cur.page && !sameState(cur, next)) {
      if (opts.reset) {
        navStack = [];
      } else {
        navStack.push({ page: cur.page, params: JSON.parse(JSON.stringify(cur.params)), scrollY: window.scrollY });
        if (navStack.length > 60) navStack.shift();
      }
    }
    cur = next;

    document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
    $(PAGE_DOM[page])?.classList.add('active-page');

    updateMenuState();
    injectPageHeader();
    updateBackButton();
    window.scrollTo({ top: 0, behavior: 'instant' });

    const token = ++renderToken;
    const job = renderCurrent({ fromBack: !!opts.fromBack, token });
    if (opts.scrollY != null) {
      Promise.resolve(job).finally(() => window.scrollTo({ top: opts.scrollY, behavior: 'instant' }));
    }
  }

  let renderToken = 0;

  function goBack() {
    if (chatLightboxOpen()) { chatCloseLightbox(); return; }
    if (chatState.userId) { closeChatView(); return; }
    hideFixedBar();
    const prev = navStack.pop();
    if (!prev) { openPage('orders', {}, { fromBack: true }); return; }
    openPage(prev.page, prev.params, { fromBack: true, scrollY: prev.scrollY });
  }

  function renderCurrent(ctx) {
    switch (cur.page) {
      case 'orders': return runWithLoader(() => renderOrdersPage(), 2000);
      case 'users': return runWithLoader(() => renderUsersPage(), 2000);
      case 'reviews': return runWithLoader(() => renderReviewsPage(), 2000);
      case 'chats': return runWithLoader(() => renderChatsPage(), 2000);
      case 'stats': return runWithLoader(() => renderStatsPage(), 2000);
      case 'profile': return runWithLoader(() => renderProfilePage(), 2000);
      case 'wallet': return runWithLoader(() => renderWalletPage(), 0);
      case 'settings': return Promise.resolve(renderSettingsPage());
      case 'order': return runWithLoader(() => renderOrderDetailPage(cur.params.id), 2000);
      case 'user': return runWithLoader(() => renderUserPage(cur.params.id), 2000);
      case 'promos': return runWithLoader(() => renderPromosPage(), 2000);
      case 'create-promo': return Promise.resolve(renderCreatePromoPage());
    }
  }

  // Перерисовать текущую страницу (после изменения данных), не трогая историю
  function rerenderCurrent() {
    return renderCurrent({ fromBack: true });
  }

  // Открыть страницу пользователя по id (с подгрузкой данных для заголовка)
  async function openUserPage(userId, hint) {
    if (!userId) return;
    hapticLight();
    let name = hint && (hint.user_name || hint.nickname);
    if (!name) {
      try { const u = await apiGet(`/api/user/${encodeURIComponent(userId)}`); name = u.user_name; } catch (e) {}
    }
    openPage('user', { id: String(userId), name: name || 'Пользователь', tab: 'wallet' });
  }

  async function openOrderByNumber(number) {
    let order = allOrders.find(o => String(o.order_number) === String(number));
    if (!order) {
      try {
        const r = await apiSend('POST', '/api/refresh-order', { orderNumber: String(number) });
        if (r.ok && r.data && r.data.id) order = r.data;
      } catch (e) {}
    }
    if (order) openPage('order', { id: order.id, number: order.order_number });
  }

  // =============================================
  // ОБЩИЕ БЛОКИ: товары в заказе, статусы
  // =============================================
  function getStatusTextClass(statusCode) {
    const map = {
      'pending': 'status-pending-text', 'awaiting_code': 'status-awaiting_text',
      'cancelled': 'status-cancelled-text', 'notfound': 'status-cancelled-text',
      'processing': 'status-processing-text', 'in_progress': 'status-inprogress-text',
      'completed': 'status-completed-text', 'done': 'status-completed-text'
    };
    return map[String(statusCode || '').toLowerCase()] || '';
  }
  function getStatusBgClass(statusCode) {
    const map = {
      'pending': 'status-pending-bg', 'awaiting_code': 'status-awaiting-bg',
      'cancelled': 'status-cancelled-bg', 'notfound': 'status-cancelled-bg',
      'processing': 'status-processing-bg', 'in_progress': 'status-inprogress-bg',
      'completed': 'status-completed-bg', 'done': 'status-completed-bg'
    };
    return map[String(statusCode || '').toLowerCase()] || '';
  }
  function getStatusDisplayText(statusCode, originalStatus) {
    const map = {
      'pending': 'Ожидает проверки', 'awaiting_code': 'Ожидание кода', 'cancelled': 'Отменен',
      'notfound': 'Заказ отменён', 'processing': 'Ожидает выполнения', 'in_progress': 'Выполняется',
      'completed': 'Заказ выполнен', 'done': 'Заказ выполнен'
    };
    return map[String(statusCode || '').toLowerCase()] || originalStatus || 'Ожидает проверки';
  }
  function getStatusColor(statusCode) {
    switch (String(statusCode || '').toLowerCase()) {
      case 'awaiting_code': case 'in_progress': return '#eab308';
      case 'cancelled': case 'notfound': return '#ef4444';
      case 'completed': case 'done': return '#22c55e';
      default: return '#4cb4e9';
    }
  }
  function isCompletedCode(code) { return code === 'completed' || code === 'done'; }

  function parseItems(raw) {
    try { const a = JSON.parse(raw || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; }
  }

  function buildItemPriceHtml(price, originalPrice, priceClass) {
    const hasDiscount = originalPrice && originalPrice !== price;
    return `<span class="${priceClass}" style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
    ${hasDiscount ? `<span style="color:var(--text-price-old);text-decoration:line-through;font-size:14px;">${formatPrice(originalPrice)}</span>` : ''}
    ${formatPrice(price)}
</span>`;
  }

  // Максимум 2 строки: если товаров 3+, то «Ещё n товара/ов» и их сумма (как на фронтенде)
  function buildCollapsedItemsHtml(items, rowClass, nameClass, priceClass) {
    if (!items || !items.length) return '';
    const sorted = items.slice().sort((a, b) => (a.price * a.qty) - (b.price * b.qty));
    if (sorted.length <= 2) {
      return sorted.map(i => `
        <div class="${rowClass}">
            <span class="${nameClass}">${escapeHtml(i.name)}${i.qty > 1 ? `, ${i.qty} шт.` : ''}</span>
            ${buildItemPriceHtml(i.price * i.qty, i.originalPrice ? i.originalPrice * i.qty : null, priceClass)}
        </div>`).join('');
    }
    const first = sorted[0];
    const rest = sorted.slice(1);
    const restSum = rest.reduce((s, i) => s + i.price * i.qty, 0);
    const restOriginalSum = rest.reduce((s, i) => s + (i.originalPrice ? i.originalPrice * i.qty : i.price * i.qty), 0);
    return `
    <div class="${rowClass}">
        <span class="${nameClass}">${escapeHtml(first.name)}${first.qty > 1 ? `, ${first.qty} шт.` : ''}</span>
        ${buildItemPriceHtml(first.price * first.qty, first.originalPrice ? first.originalPrice * first.qty : null, priceClass)}
    </div>
    <div class="${rowClass}">
        <span class="${nameClass}">Ещё ${rest.length} ${pluralizeTovar(rest.length)}</span>
        ${buildItemPriceHtml(restSum, restOriginalSum !== restSum ? restOriginalSum : null, priceClass)}
    </div>`;
  }

  function computeOrderRawTotal(items) {
    return items.reduce((s, i) => s + (i.originalPrice != null ? i.originalPrice : i.price) * i.qty, 0);
  }

  function getOrderServiceName(order) {
    if (order.game_name) return order.game_name;
    const items = parseItems(order.items);
    return items[0]?.name || '—';
  }

  // Карточка заказа (список заказов / заказы пользователя) — как на фронтенде
  function buildOrderCardHtml(o) {
    const items = parseItems(o.items);
    const statusDisplay = getStatusDisplayText(o.status_code, o.status);
    const status = String(o.status_code).trim().toLowerCase();
    const itemsHtml = buildCollapsedItemsHtml(items, 'order-item-row', 'order-item-name', 'order-item-price');
    const rawTotal = computeOrderRawTotal(items);
    const showOldTotal = o.promo_discount && rawTotal !== o.total;
    return `<div class="order-wrapper" data-order-id="${o.id}">
                    <div class="order-main-card" data-open-order="${o.id}">
                        <div class="order-header">
                            <span class="order-id">Заказ #${escapeHtml(o.order_number)}</span>
                            <div class="order-header-right">
                                <span class="order-card-status ${getStatusTextClass(status)} ${getStatusBgClass(status)}">${statusDisplay}</span>
                            </div>
                        </div>
                        <div class="order-date">${escapeHtml(o.date)} ${escapeHtml(o.time || '')}</div>
                        <div class="order-total" style="display:flex;align-items:baseline;gap:8px;">
                            ${formatPrice(o.total)}
                            ${showOldTotal ? `<span style="color:var(--text-price-old);text-decoration:line-through;font-size:15px;">${formatPrice(rawTotal)}</span>` : ''}
                        </div>
                        <svg class="icon icon-info-order-status icon--accent order-status-info-icon" data-status-info="${o.id}"><use href="#icon-info"></use></svg>
                    </div>
                    <div class="order-items-card">
                        ${itemsHtml}
                    </div>
                </div>`;
  }

  // Алерт информации о заказе (К заказу / закрыть — как на фронтенде)
  function showOrderStatusInfo(order) {
    if (!order) return;
    const message =
      `Информация о заказе:\n\n` +
      `Номер заказа: #${order.order_number}\n` +
      `Сервис: ${truncate(getOrderServiceName(order), 40)}\n` +
      `Дата: ${order.date} ${order.time || ''}\n` +
      `Статус: ${getStatusDisplayText(order.status_code, order.status)}\n` +
      `Сумма заказа: ${formatPrice(order.total)}`;
    showPopup({
      message,
      buttons: [
        { id: 'goto_order', type: 'default', text: 'К заказу' },
        { id: 'close', type: 'close' }
      ]
    }, (buttonId) => {
      if (buttonId === 'goto_order') {
        hapticLight();
        openPage('order', { id: order.id, number: order.order_number });
      }
    });
  }

  // =============================================
  // КАРТОЧКА ОТЗЫВА (как на фронтенде + админские действия)
  // =============================================
  function getSatisfactionColors(rating) {
    if (rating === 'good') return { color: '#22c55e', bg: 'rgba(34, 197, 94, 0.12)', border: 'rgba(34, 197, 94, 0.04)', icon: 'icon-review-happy' };
    return { color: '#ef4444', bg: 'rgba(239, 68, 68, 0.12)', border: 'rgba(239, 68, 68, 0.04)', icon: 'icon-review-sad' };
  }
  function reviewRatingOf(rv) { return rv.rating || (rv.satisfied ? 'good' : 'bad'); }

  function buildReviewCardHtml(rv, opts) {
    opts = opts || {};
    const avatar = rv.photo_url
      ? `<img style="width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;" src="${escapeHtml(rv.photo_url)}" alt="avatar">`
      : `<div class="review-avatar">👤</div>`;
    const dt = rv.created_at ? new Date(rv.created_at) : null;
    const dateStr = dt
      ? `${dt.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })} ${dt.toLocaleDateString('ru-RU', { year: '2-digit', month: '2-digit', day: '2-digit' })}`
      : '';
    const rc = getSatisfactionColors(reviewRatingOf(rv));
    const orderBadge = rv.order_number
      ? `<div class="review-badge-stack">
            <span class="review-order-badge-wrap">
                <span class="review-order-badge-backdrop"></span>
                <span class="review-order-badge" data-order-num="${escapeHtml(rv.order_number)}">#${escapeHtml(rv.order_number)}</span>
            </span>
            <span class="review-rating-badge" data-review-id="${rv.id}" style="background:${rc.bg};color:${rc.color};border-color:${rc.border};">
                <svg width="21" height="21" viewBox="0 0 512 512"><use href="#${rc.icon}"></use></svg>
            </span>
        </div>`
      : `<div class="review-badge-stack">
            <span class="review-rating-badge" data-review-id="${rv.id}" style="padding-left:12px;margin-left:0;background:${rc.bg};color:${rc.color};border-color:${rc.border};">
                <svg width="21" height="21" viewBox="0 0 512 512"><use href="#${rc.icon}"></use></svg>
            </span>
        </div>`;
    const items = parseItems(rv.order_items);
    const itemsHtml = buildCollapsedItemsHtml(items, 'review-item-row', 'review-item-name', 'review-item-price');
    const clamp = opts.full ? ' style="-webkit-line-clamp:unset;"' : '';
    return `<div class="review-card-wrapper"${opts.topGap ? ' style="margin-top:14px;"' : ''}><div class="review-card"><div class="review-header">${avatar}<div class="review-header-info"><div class="review-author-name" data-user-id="${escapeHtml(rv.user_id || '')}" data-user-name="${escapeHtml(rv.user_name || '')}">${escapeHtml(rv.user_name || 'Пользователь')}</div><div class="review-date">${dateStr}</div></div>${orderBadge}</div><div class="review-text"${clamp}>${escapeHtml(rv.text)}</div></div>${itemsHtml ? `<div class="review-items-card">${itemsHtml}</div>` : ''}</div>`;
  }

  function confirmDeleteReview(reviewId) {
    hapticLight();
    showPopup({
      message: 'Удалить отзыв?',
      buttons: [{ id: 'ok', type: 'destructive', text: 'Удалить' }, { id: 'cancel', type: 'cancel' }]
    }, async (buttonId) => {
      if (buttonId !== 'ok') return;
      try {
        const r = await apiSend('DELETE', `/api/reviews/${reviewId}`);
        if (r.ok) { hapticLight(); reviewsCache = null; rerenderCurrent(); }
        else showAppAlert('Ошибка удаления');
      } catch (e) { showAppAlert('Ошибка соединения'); }
    });
  }

  // Отзывы: новый эндпоинт без лимита, при необходимости — старый
  async function fetchReviews(filter) {
    const qs = new URLSearchParams();
    if (filter?.userId) qs.set('userId', filter.userId);
    if (filter?.orderId) qs.set('orderId', filter.orderId);
    try {
      return await apiGet('/api/admin/reviews' + (qs.toString() ? '?' + qs : ''));
    } catch (e) {
      const all = await apiGet('/api/reviews');
      return all.filter(rv =>
        (!filter?.userId || String(rv.user_id) === String(filter.userId)) &&
        (!filter?.orderId || String(rv.order_id) === String(filter.orderId)));
    }
  }

  // =============================================
  // КОШЕЛЁК: строки операций (как на фронтенде)
  // =============================================
  const TX_LABELS = { cashback_own: 'Кэшбэк', cashback_referral: 'Реферал', purchase: 'Покупка', admin_topup: 'Админ' };

  function buildWalletTxRowHtml(tx, mode) {
    const isPositive = tx.amount >= 0;
    let title;
    if (tx.type === 'purchase' || tx.type === 'cashback_referral' || tx.type === 'cashback_own') {
      title = tx.order_number ? `Заказ #${tx.order_number}` : (TX_LABELS[tx.type] || '');
    } else {
      title = tx.amount >= 0 ? 'Пополнение' : 'Списание';
    }
    const dt = tx.created_at ? new Date(tx.created_at) : null;
    let dateStr = '';
    if (dt && !isNaN(dt)) {
      const hh = String(dt.getHours()).padStart(2, '0');
      const mm = String(dt.getMinutes()).padStart(2, '0');
      const dd = String(dt.getDate()).padStart(2, '0');
      const mo = String(dt.getMonth() + 1).padStart(2, '0');
      const yy = String(dt.getFullYear()).slice(2);
      dateStr = `${hh}:${mm} ${dd}.${mo}.${yy}`;
    }
    // mode 'goto-user' — общая история: по нажатию переход на страницу владельца операции
    // mode 'delete'    — история конкретного пользователя: по нажатию удаление операции
    const attrs = mode === 'goto-user'
      ? `class="wallet-tx-row tx-nav" data-goto-user="${escapeHtml(tx.user_id)}" data-user-name="${escapeHtml(tx.user_name || '')}"`
      : `class="wallet-tx-row tx-nav" data-tx-id="${tx.id}"`;
    return `<div ${attrs}>
            <div class="wallet-tx-line1">
                <span class="wallet-tx-title">${escapeHtml(title)}</span>
                <span class="wallet-tx-amount ${isPositive ? 'positive' : 'negative'}">${isPositive ? '+' : '-'}${formatPrice(Math.abs(tx.amount))}</span>
            </div>
            <div class="wallet-tx-line2">
                <span class="wallet-tx-date">${dateStr}</span>
                <span class="wallet-tx-subtitle">${escapeHtml(TX_LABELS[tx.type] || '')}</span>
            </div>
        </div>`;
  }

  function buildWalletTxListHtml(list, showMoreBtnId, mode) {
    if (!list.length) return `<div class="review-empty">История операций пуста</div>`;
    let html = list.map(tx => buildWalletTxRowHtml(tx, mode)).join('');
    if (showMoreBtnId) html += `<div class="wallet-show-more-row" id="${showMoreBtnId}">Показать все операции</div>`;
    return html;
  }

  function buildReferralRowHtml(r) {
    return `<div class="wallet-tx-row ref-nav" data-goto-user="${escapeHtml(r.user_id || '')}" data-user-name="${escapeHtml(r.nickname || '')}">
        <div class="wallet-tx-line1">
            <span class="wallet-tx-title">${escapeHtml(r.nickname || 'Пользователь')}</span>
            <span class="wallet-tx-amount" style="color:var(--text-primary);">${formatPrice(r.earned || 0)}</span>
        </div>
        <div class="wallet-tx-line2">
            <span class="wallet-tx-date">Пользователь</span>
            <span class="wallet-tx-subtitle">Заработано</span>
        </div>
    </div>`;
  }

  function buildReferralListHtml(list, showMoreBtn) {
    if (!list.length) return `<div class="review-empty">Пока нет приглашённых</div>`;
    let html = list.map(buildReferralRowHtml).join('');
    if (showMoreBtn) html += `<div class="wallet-show-more-row" id="referralsShowMoreBtn">Показать всех рефералов</div>`;
    return html;
  }

  // Статистика «левая / правая» (карточка как «Реферальная программа»)
  function statsInnerHtml(leftValue, leftBadge, leftLabel, rightValue, rightBadge, rightLabel) {
    return `<div class="referral-stats-inner">
        <div class="referral-stat-item left">
            <div style="display:flex;align-items:center;gap:6px;">
                <span class="referral-stat-value">${leftValue}</span>
                <span class="referral-badge">${leftBadge}</span>
            </div>
            <div class="referral-stat-label">${leftLabel}</div>
        </div>
        <div class="referral-stat-divider"></div>
        <div class="referral-stat-item right">
            <div style="display:flex;align-items:center;gap:6px;">
                <span class="referral-stat-value">${rightValue}</span>
                <span class="referral-badge">${rightBadge}</span>
            </div>
            <div class="referral-stat-label">${rightLabel}</div>
        </div>
    </div>`;
  }

  // Карточка кошелька (как на фронтенде)
  function walletCardInnerHtml(balance, label, ids) {
    return `<div style="background:var(--card-bg);border-radius:29px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;">
        <div style="padding-left:2px;">
            <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:20px;font-weight:550;color:var(--text-primary);">${formatPrice(balance)}</span>
                <span style="font-size:15px;font-weight:550;color:#4cb4e9;background:var(--accent-blue-bg);border-radius:20px;padding:2px 8px;">2%</span>
            </div>
            <div style="font-size:15px;color:var(--text-secondary);margin-top:4px;">${label}</div>
        </div>
        <div style="display:flex;gap:10px;flex-shrink:0;">
            <button class="wallet-square-btn" id="${ids.plus}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4cb4e9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button class="wallet-square-btn" id="${ids.second}">
                ${ids.secondIcon}
            </button>
        </div>
    </div>`;
  }
  const ICON_ARROW_RIGHT = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4cb4e9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;
  const ICON_ARROW_UP = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4cb4e9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>`;

  function bindShowMore(btnId, wrapId, fetcher, builder) {
    $(btnId)?.addEventListener('click', async function () {
      hapticLight();
      this.textContent = 'Загрузка...';
      try {
        const all = await fetcher();
        const wrap = $(wrapId);
        if (wrap) wrap.innerHTML = builder(all);
      } catch (e) {
        this.textContent = 'Показать все';
      }
    });
  }

  // =============================================
  // ЗАКАЗЫ: список
  // =============================================
  let allOrders = [];
  let ordersLoaded = false;
  let ordersLoadFailed = false;

  const ORDER_STATUS_CATEGORIES = [
    { value: 'all', label: 'Все заказы' },
    { value: 'notfound', label: 'Отмененные' },
    { value: 'done', label: 'Выполненные' },
    { value: 'uncompleted', label: 'Невыполненные' }
  ];
  function orderMatchesCategory(o, cat) {
    const c = String(o.status_code || '').toLowerCase();
    if (cat === 'all') return true;
    if (cat === 'done') return isCompletedCode(c);
    if (cat === 'notfound') return c === 'notfound' || c === 'cancelled';
    if (cat === 'uncompleted') return !isCompletedCode(c);
    return c === cat;
  }
  function fillOrderCategorySelect() {
    const sel = $('orderStatusSelect');
    if (!sel) return;
    sel.innerHTML = ORDER_STATUS_CATEGORIES.map(c => {
      const n = ordersLoaded ? ` (${allOrders.filter(o => orderMatchesCategory(o, c.value)).length})` : '';
      return `<option value="${c.value}" ${ordersStatusFilter === c.value ? 'selected' : ''}>${c.label}${n}</option>`;
    }).join('');
  }
  let ordersStatusFilter = 'all';

  async function loadOrders() {
    try {
      allOrders = await apiGet('/api/orders');
      ordersLoaded = true;
      ordersLoadFailed = false;
    } catch (e) {
      ordersLoadFailed = true;
    }
    if (cur.page === 'orders') applyOrdersFilters();
  }

  async function renderOrdersPage() {
    fillOrderCategorySelect();
    if (ordersLoaded) applyOrdersFilters();
    await loadOrders();
    fillOrderCategorySelect();
  }

  function applyOrdersFilters() {
    const container = $('ordersList');
    if (!container) return;
    if (!ordersLoaded) {
      container.innerHTML = ordersLoadFailed ? `<div class="empty-message"><div class="empty-title">Ошибка загрузки</div></div>` : '';
      return;
    }
    const q = ($('orderSearchInput')?.value || '').trim().toLowerCase().replace(/^#/, '');
    let filtered = allOrders;
    filtered = filtered.filter(o => orderMatchesCategory(o, ordersStatusFilter));
    if (q) filtered = filtered.filter(o => String(o.order_number).toLowerCase().includes(q));

    if (!allOrders.length) {
      container.innerHTML = `<div class="empty-message"><div class="empty-title">Заказов ещё нет</div></div>`;
      return;
    }
    if (!filtered.length) {
      container.innerHTML = `<div class="empty-message"><div class="empty-title">Заказы не найдены</div></div>`;
      return;
    }
    container.innerHTML = filtered.map(buildOrderCardHtml).join('');
  }

  // =============================================
  // ЗАКАЗ: страница
  // =============================================
  const STATUS_DROPDOWN_OPTIONS = [
    { value: 'awaiting_code', label: 'Ожидание кода' },
    { value: 'processing', label: 'Ожидает выполнения' },
    { value: 'in_progress', label: 'Выполняется' },
    { value: 'done', label: 'Заказ выполнен' },
    { value: 'notfound', label: 'Заказ отменён' }
  ];

  async function getOrderForPage(id) {
    let order = allOrders.find(o => String(o.id) === String(id));
    if (order) return order;
    try {
      const r = await apiSend('POST', '/api/refresh-order', { orderId: id });
      if (r.ok && r.data && r.data.id) return r.data;
    } catch (e) {}
    return null;
  }

  function showOrderDetailInfoAlert(order) {
    const message =
      `Информация о заказе:\n\n` +
      `Номер заказа: #${order.order_number}\n` +
      `Сервис: ${truncate(getOrderServiceName(order), 40)}\n` +
      `Дата: ${order.date} ${order.time || ''}\n` +
      `Статус: ${getStatusDisplayText(order.status_code, order.status)}\n` +
      `Сумма заказа: ${formatPrice(order.total)}`;
    showPopup({
      message,
      buttons: [
        { id: 'delete_order', type: 'destructive', text: 'Удалить' },
        { id: 'close', type: 'close' }
      ]
    }, (buttonId) => { if (buttonId === 'delete_order') deleteOrderConfirm(order); });
  }

  function deleteOrderConfirm(order) {
    hapticLight();
    showPopup({
      message: `Удалить заказ #${order.order_number}?`,
      buttons: [{ id: 'ok', type: 'destructive', text: 'Удалить' }, { id: 'cancel', type: 'cancel' }]
    }, async (buttonId) => {
      if (buttonId !== 'ok') return;
      try {
        const r = await apiSend('DELETE', `/api/orders/${order.id}`);
        if (r.ok) {
          hapticLight();
          await loadOrders();
          goBack();
        } else showAppAlert('Ошибка удаления');
      } catch (e) { showAppAlert('Ошибка соединения'); }
    });
  }

  async function renderOrderDetailPage(orderId) {
    const container = $('orderDetailContent');
    if (!container) return;
    container.innerHTML = '';
    hideFixedBar();
    const order = await getOrderForPage(orderId);
    if (cur.page !== 'order' || String(cur.params.id) !== String(orderId)) return;
    if (!order) { container.innerHTML = `<div class="review-empty">Заказ не найден</div>`; return; }

    const items = parseItems(order.items);
    const itemsHtml = items.slice().sort((a, b) => (a.price * a.qty) - (b.price * b.qty)).map(i =>
      `<div class="order-item-row">
          <span class="order-item-name">${escapeHtml(i.name)}${i.qty > 1 ? `, ${i.qty} шт.` : ''}</span>
          <span class="order-item-price" style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
              ${i.originalPrice && i.originalPrice !== i.price
                ? `<span style="color:var(--text-price-old);text-decoration:line-through;font-size:14px;">${formatPrice(i.originalPrice * i.qty)}</span>` : ''}
              ${formatPrice(i.price * i.qty)}
          </span>
      </div>`).join('');

    const code = String(order.status_code || 'pending').toLowerCase();
    const initCode = code === 'completed' ? 'done' : code;
    const inList = STATUS_DROPDOWN_OPTIONS.some(o => o.value === initCode);
    const serviceName = order.game_name || '';
    const isTelegramOrder = serviceName.trim().toLowerCase() === 'telegram';
    const statusDisplay = getStatusDisplayText(order.status_code, order.status);

    // Если текущий статус не из списка (например «Ожидает проверки») — он первой неактивной строкой-подсказкой
    const optionsHtml =
      (!inList ? `<option value="" disabled selected>${escapeHtml(statusDisplay)}</option>` : '') +
      STATUS_DROPDOWN_OPTIONS.map(o => `<option value="${o.value}" ${o.value === initCode ? 'selected' : ''}>${o.label}</option>`).join('');

    container.innerHTML = `
        <div class="order-data-card" id="orderDataCard">
            <div class="order-detail-row order-status-row">
                <span class="order-detail-label">Статус</span>
                <span class="order-detail-value" id="orderStatusText" style="color:${getStatusColor(order.status_code)}">${statusDisplay}</span>
                <select id="orderStatusDropdown">${optionsHtml}</select>
            </div>
            <div class="order-detail-row">
                <span class="order-detail-label">Дата</span>
                <span class="order-detail-value">${escapeHtml(order.date)} ${escapeHtml(order.time || '')}</span>
            </div>
            ${serviceName ? `<div class="order-detail-row">
                <span class="order-detail-label">Сервис</span>
                <span class="order-detail-value">${escapeHtml(serviceName)}</span>
            </div>` : ''}
            <div class="order-detail-row">
                <span class="order-detail-label">Способ оплаты</span>
                <span class="order-detail-value">${escapeHtml(order.payment_method || '—')}</span>
            </div>
            <div class="order-detail-row">
                <span class="order-detail-label">Отправитель</span>
                <span class="order-detail-value">${escapeHtml(order.sender_name || '—')}</span>
            </div>
            <div class="order-detail-row">
                <span class="order-detail-label">${isTelegramOrder ? 'Получатель' : 'Почта'}</span>
                <span class="order-detail-value">${escapeHtml(order.email || '—')}</span>
            </div>
            ${order.promo ? `<div class="order-detail-row">
                <span class="order-detail-label">Промокод</span>
                <span class="order-detail-value">${escapeHtml(order.promo)} (${escapeHtml(order.promo_discount)}%)</span>
            </div>` : ''}
            ${order.verification_code ? `<div class="order-detail-row">
                <span class="order-detail-label">Код</span>
                <span class="order-detail-value">${escapeHtml(order.verification_code)}</span>
            </div>` : ''}
            <div class="order-detail-row">
                <span class="order-detail-label">Покупатель</span>
                <span class="order-detail-value order-buyer-link" id="orderBuyerLink" data-user-id="${escapeHtml(order.user_id || '')}" data-user-name="${escapeHtml(order.user_name || '')}">${escapeHtml(order.user_name || '—')}</span>
            </div>
            <div class="order-detail-row" style="padding-bottom:4px;">
                <span class="order-detail-label" style="font-weight:400;">Сумма заказа</span>
                <span class="order-detail-value" style="color:var(--text-primary); font-weight:500;">${formatPrice(order.total)}</span>
            </div>
        </div>
        <div class="order-items-card" style="margin-top: -32px; padding-top: 40px;">
            ${itemsHtml}
        </div>
        <div id="orderReviewBlock"></div>`;

    // --- выбор статуса: блок с кнопкой появляется только после выбора другого статуса ---
    let pendingCode = initCode;
    const dd = $('orderStatusDropdown');
    dd?.addEventListener('change', (e) => {
      pendingCode = e.target.value;
      const opt = STATUS_DROPDOWN_OPTIONS.find(o => o.value === pendingCode);
      const txt = $('orderStatusText');
      if (txt && opt) { txt.textContent = opt.label; txt.style.color = getStatusColor(pendingCode); }
      refreshStatusBar();
    });

    function refreshStatusBar() {
      if (!inList && pendingCode === initCode) { hideFixedBar(); return; }
      if (pendingCode === initCode) { hideFixedBar(); return; }
      showFixedBar(`<div class="checkout-card"><div class="checkout-buttons-row">
          <button class="checkout-button" id="adminSaveStatusBtn">Сохранить статус</button>
          <button class="promo-btn" id="adminOrderInfoBtn"><svg class="icon icon--accent" style="width:24px;height:24px;"><use href="#icon-info"></use></svg></button>
      </div></div>`);
      $('adminSaveStatusBtn')?.addEventListener('click', saveStatus);
      $('adminOrderInfoBtn')?.addEventListener('click', () => { hapticLight(); showOrderDetailInfoAlert(order); });
    }

    function saveStatus() {
      const opt = STATUS_DROPDOWN_OPTIONS.find(o => o.value === pendingCode);
      if (!opt || pendingCode === initCode) return;
      hapticLight();
      showPopup({
        message: `Изменить статус заказа на «${opt.label}»?`,
        buttons: [{ id: 'confirm', type: 'default', text: 'Изменить' }, { id: 'cancel', type: 'cancel' }]
      }, async (buttonId) => {
        if (buttonId !== 'confirm') return;
        hapticMedium();
        showTopLoader();
        try {
          const r = await apiSend('POST', '/api/update-status', { orderId: order.id, status: opt.label, statusCode: pendingCode });
          if (r.ok) {
            await loadOrders();
            if (cur.page === 'order') renderOrderDetailPage(order.id);
          } else showAppAlert('Ошибка обновления статуса');
        } catch (e) { showAppAlert('Ошибка соединения'); }
        finally { hideTopLoader(); }
      });
    }

    // Удержание карточки данных — информация о заказе (там удаление заказа)
    const card = $('orderDataCard');
    if (card) {
      let t = null;
      const start = (e) => {
        if (e.target.closest('select, .order-buyer-link')) return;
        t = setTimeout(() => { hapticMedium(); showOrderDetailInfoAlert(order); }, 600);
      };
      const stop = () => clearTimeout(t);
      card.addEventListener('pointerdown', start);
      ['pointerup', 'pointerleave', 'pointercancel', 'pointermove'].forEach(ev => card.addEventListener(ev, stop));
    }

    // Отзыв на выполненный заказ
    if (isCompletedCode(code)) {
      try {
        const list = await fetchReviews({ orderId: order.id });
        if (cur.page === 'order' && String(cur.params.id) === String(order.id) && list[0]) {
          const block = $('orderReviewBlock');
          if (block) block.innerHTML = buildReviewCardHtml(list[0], { full: true, topGap: true });
        }
      } catch (e) {}
    }
  }

  // =============================================
  // ПОЛЬЗОВАТЕЛИ: список
  // =============================================
  const DAY_MS = 24 * 60 * 60 * 1000;
  let usersData = [];
  let usersLoaded = false;
  let usersFilter = 'all';
  let usersSearch = '';
  let usersShowAll = false;

  function userAvatarHtml(u) {
    return u.photo_url
      ? `<img class="user-row-avatar" src="${escapeHtml(u.photo_url)}" alt="avatar">`
      : `<div class="user-row-avatar">👤</div>`;
  }

  function buildUserRowHtml(u) {
    const uname = u.user_username ? '@' + u.user_username : '@username';
    return `<div class="wallet-tx-row user-list-row" data-goto-user="${escapeHtml(u.user_id)}" data-user-name="${escapeHtml(u.user_name || '')}">
        ${userAvatarHtml(u)}
        <div class="user-list-body">
            <div class="wallet-tx-line1">
                <span class="wallet-tx-title">${escapeHtml(u.user_name || 'Без имени')}</span>
                <span class="wallet-tx-amount" style="color:var(--text-primary);">${formatPrice(u.balance || 0)}</span>
            </div>
            <div class="wallet-tx-line2">
                <span class="wallet-tx-date">${escapeHtml(uname)}</span>
                <span class="wallet-tx-subtitle">Баланс</span>
            </div>
        </div>
    </div>`;
  }

  function renderUsersView() {
    const container = $('usersContent');
    if (!container || !usersLoaded) return;
    const users = usersData;
    const now = Date.now();
    const total = users.length;
    const new24 = users.filter(u => u.first_seen && now - new Date(u.first_seen).getTime() <= DAY_MS).length;
    const active = users.filter(u => parseInt(u.orders_count) > 0);
    const activeNew24 = active.filter(u => u.first_order_ts && now - Number(u.first_order_ts) <= DAY_MS).length;
    const blocked = users.filter(u => u.status === 'blocked');

    if (!$('userSearchInput')) {
      container.innerHTML = `
        <div class="search-section" style="display:flex;gap:10px;margin-bottom:13px;align-items:center;">
            <div class="search-bar">
                <img class="search-icon" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='%239ca3af'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z'%3E%3C/path%3E%3C/svg%3E">
                <input type="text" class="search-input" id="userSearchInput" placeholder="Имя, @юзернейм или ID" value="${escapeHtml(usersSearch)}">
                <svg class="icon search-clear-btn icon--muted ${usersSearch ? 'visible' : ''}" id="userSearchClearBtn"><use href="#icon-cancel"></use></svg>
            </div>
            <div class="filter-btn" style="cursor:pointer;position:relative;overflow:hidden;">
                <svg class="icon icon-filter-catalog icon--primary"><use href="#icon-filter"></use></svg>
                <select id="userStatusFilterSelect" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px;"></select>
            </div>
        </div>
        <div class="referral-wrapper">
            <div class="referral-main-card">
                <div class="referral-title">Статистика пользователей</div>
                <div style="font-size:17px;color:var(--text-secondary);font-weight:500;">Статистика всех пользователей</div>
            </div>
            <div class="referral-bottom-card" id="usersStatsWrap"></div>
        </div>
        <div class="profile-wrapper" style="margin-top:13px;">
            <div class="referral-main-card">
                <div class="referral-title">Пользователи приложения</div>
                <div style="font-size:17px;color:var(--text-secondary);font-weight:500;">База пользователей приложения</div>
            </div>
            <div class="referral-bottom-card">
                <div style="background:var(--card-bg);border-radius:29px;padding:16px 18px;" id="usersListWrap"></div>
            </div>
        </div>`;
    }

    const filterSelect = $('userStatusFilterSelect');
    if (filterSelect) {
      const opts = [
        { key: 'all', label: 'Все пользователи', count: total },
        { key: 'balance', label: 'Сортировка (₽)' },
        { key: 'active', label: 'Активные', count: active.length },
        { key: 'inactive', label: 'Неактивные', count: total - active.length },
        { key: 'blocked', label: 'Заблокированные', count: blocked.length }
      ];
      filterSelect.innerHTML = opts.map(o => `<option value="${o.key}" ${usersFilter === o.key ? 'selected' : ''}>${o.label}${o.count !== undefined ? ` (${o.count})` : ''}</option>`).join('');
    }

    const statsWrap = $('usersStatsWrap');
    if (statsWrap) statsWrap.innerHTML = statsInnerHtml(total, `+${new24}`, 'Всего польз.', active.length, `+${activeNew24}`, 'Актив. польз.');

    // список: сначала новые
    let list = users.slice().sort((a, b) => new Date(b.first_seen || 0) - new Date(a.first_seen || 0));
    if (usersFilter === 'active') list = list.filter(u => parseInt(u.orders_count) > 0);
    if (usersFilter === 'inactive') list = list.filter(u => !(parseInt(u.orders_count) > 0));
    if (usersFilter === 'blocked') list = list.filter(u => u.status === 'blocked');
    if (usersFilter === 'balance') list = list.slice().sort((a, b) => (Number(b.balance) || 0) - (Number(a.balance) || 0));
    const rawQ = usersSearch.trim();
    if (rawQ) {
      if (rawQ.startsWith('@')) {
        const uq = rawQ.slice(1).toLowerCase();
        list = list.filter(u => (u.user_username || '').toLowerCase().includes(uq));
      } else if (/^\d+$/.test(rawQ)) {
        list = list.filter(u => String(u.user_id).includes(rawQ));
      } else {
        const nq = rawQ.toLowerCase();
        list = list.filter(u => (u.user_name || '').toLowerCase().includes(nq));
      }
    }
    const filtering = !!rawQ || usersFilter !== 'all';
    const limited = !filtering && !usersShowAll && list.length > 5;
    const shown = limited ? list.slice(0, 5) : list;

    const wrap = $('usersListWrap');
    if (wrap) {
      if (!list.length) wrap.innerHTML = `<div class="review-empty">Никого не найдено</div>`;
      else wrap.innerHTML = shown.map(buildUserRowHtml).join('') +
        (limited ? `<div class="wallet-show-more-row" id="usersShowAllBtn">Показать всех пользователей</div>` : '');
    }
  }

  async function renderUsersPage() {
    if (usersLoaded) renderUsersView();
    try {
      const data = await apiGet('/api/users');
      usersData = Array.isArray(data) ? data : [];
      usersLoaded = true;
      if (cur.page === 'users') renderUsersView();
    } catch (e) {
      if (!usersLoaded && $('usersContent')) $('usersContent').innerHTML = `<div class="review-empty">Ошибка загрузки</div>`;
    }
  }

  // =============================================
  // ПОЛЬЗОВАТЕЛЬ: страница
  // =============================================
  let userPage = null; // данные текущей страницы пользователя

  function showUserInfoAlert(d) {
    const u = d.user;
    const isBlocked = u.status === 'blocked';
    const firstSeen = u.first_seen ? new Date(u.first_seen).toLocaleDateString('ru-RU') : '—';
    const completed = d.orders.filter(o => isCompletedCode(o.status_code));
    const totalSpent = completed.reduce((s, o) => s + (o.total || 0), 0);
    const message =
      `Информация о пользователе:\n\n` +
      `Имя: ${truncate(u.user_name || 'Без имени', 24)}\n` +
      `ID: ${u.user_id}\n` +
      `Регистрация: ${firstSeen}\n` +
      `Статус: ${isBlocked ? 'заблокирован' : 'активен'}\n` +
      `Баланс кошелька: ${formatPrice(u.balance || 0)}\n` +
      `Процент кэшбэка: 2%\n` +
      `Рефералов: ${d.refStats.invited || 0}\n` +
      `Всего заказов: ${d.orders.length}\n` +
      `Объем покупок: ${formatPrice(totalSpent)}`;
    showPopup({
      message,
      buttons: [{ id: 'toggleStatus', type: isBlocked ? 'default' : 'destructive', text: isBlocked ? 'Разблок. пользователя' : 'Заблок. пользователя' }]
    }, (buttonId) => {
      if (buttonId !== 'toggleStatus') return;
      // подтверждение, т.к. кнопки «Отмена» в алерте больше нет
      showPopup({
        message: isBlocked ? 'Разблокировать пользователя?' : 'Заблокировать пользователя?',
        buttons: [{ id: 'yes', type: isBlocked ? 'default' : 'destructive', text: isBlocked ? 'Разблокировать' : 'Заблокировать' }, { id: 'cancel', type: 'cancel' }]
      }, async (b2) => {
        if (b2 !== 'yes') return;
        try {
          const r = await apiSend('POST', `/api/user/${encodeURIComponent(u.user_id)}/status`, { status: isBlocked ? 'active' : 'blocked' });
          if (r.ok) {
            hapticLight();
            usersLoaded = false;
            if (cur.page === 'user') renderUserPage(u.user_id);
          } else showAppAlert('Ошибка сохранения');
        } catch (e) { showAppAlert('Ошибка соединения'); }
      });
    });
  }

  function userTabContentHtml(tab) {
    const d = userPage;
    if (!d) return '';
    if (tab === 'wallet') {
      return `<div class="profile-wrapper" style="margin-top:13px;">
        <div class="referral-main-card">
            <div class="referral-title">История всех операций</div>
            <div style="font-size:17px;color:var(--text-secondary);font-weight:500;">История всех операций кошелька</div>
        </div>
        <div class="referral-bottom-card">
            <div style="background:var(--card-bg);border-radius:29px;padding:16px 18px;" id="userTxListWrap">${buildWalletTxListHtml(d.tx, d.tx.length >= 5 ? 'userTxShowMoreBtn' : null, 'delete')}</div>
        </div>
      </div>`;
    }
    if (tab === 'orders') {
      return `<div style="margin-top:13px;">${d.orders.length ? d.orders.map(buildOrderCardHtml).join('') : '<div class="review-empty">Заказов нет</div>'}</div>`;
    }
    if (tab === 'reviews') {
      return `<div style="margin-top:13px;">${d.reviews.length ? d.reviews.map(rv => buildReviewCardHtml(rv)).join('') : '<div class="review-empty">Отзывов нет</div>'}</div>`;
    }
    return `<div class="profile-wrapper" style="margin-top:13px;">
        <div class="referral-main-card">
            <div class="referral-title">Приглашенные рефералы</div>
            <div style="font-size:17px;color:var(--text-secondary);font-weight:500;">Список приглашенных рефералов</div>
        </div>
        <div class="referral-bottom-card">
            <div style="background:var(--card-bg);border-radius:29px;padding:16px 18px;" id="referralsListWrap">${buildReferralListHtml(d.refList, d.refList.length >= 5)}</div>
        </div>
      </div>`;
  }

  function bindUserTabContent(tab) {
    const d = userPage;
    if (!d) return;
    if (tab === 'wallet') {
      bindShowMore('userTxShowMoreBtn', 'userTxListWrap',
        () => apiGet(`/api/wallet-transactions?userId=${encodeURIComponent(d.user.user_id)}&limit=1000`),
        (all) => buildWalletTxListHtml(all, null, 'delete'));
    }
    if (tab === 'referrals') {
      bindShowMore('referralsShowMoreBtn', 'referralsListWrap',
        () => apiGet(`/api/referral-list?userId=${encodeURIComponent(d.user.user_id)}&limit=1000`),
        (all) => buildReferralListHtml(all, false));
    }
  }

  function setUserTab(tab, opts) {
    opts = opts || {};
    cur.params.tab = tab;
    hideFixedBar();
    const sel = $('pageHeaderNavSelect');
    if (sel && sel.value !== tab) sel.value = tab;
    const slider = $('userCardSlider');
    const idx = USER_TABS.findIndex(t => t.id === tab);
    if (slider && opts.scroll && slider.children[idx]) slider.scrollLeft = slider.children[idx].offsetLeft - slider.offsetLeft;
    const content = $('userTabContent');
    if (content) { content.innerHTML = userTabContentHtml(tab); bindUserTabContent(tab); }
  }

  function openBalanceBar() {
    const d = userPage;
    if (!d) return;
    if ($('cartCheckoutFixed').style.display === 'block' && $('balanceAmountInput')) { hideFixedBar(); return; }
    showFixedBar(`<div class="checkout-card"><div class="promo-input-row">
        <input type="number" id="balanceAmountInput" class="promo-input" placeholder="Пополнение баланса" autocomplete="off">
        <button id="balanceConfirmBtn" class="promo-action-btn apply-btn"><svg class="icon icon-promo-apply icon--accent"><use href="#icon-success"></use></svg></button>
    </div></div>`);
    setTimeout(() => $('balanceAmountInput')?.focus(), 50);
    $('balanceConfirmBtn')?.addEventListener('click', () => {
      const amt = parseInt($('balanceAmountInput')?.value);
      if (!amt || isNaN(amt)) { showAppAlert('Введите сумму'); return; }
      hapticLight();
      showPopup({
        message: amt > 0 ? `Пополнить баланс на ${formatPrice(amt)}?` : `Списать ${formatPrice(Math.abs(amt))}?`,
        buttons: [{ id: 'confirm', type: 'default', text: 'Да' }, { id: 'cancel', type: 'cancel' }]
      }, async (buttonId) => {
        if (buttonId !== 'confirm') return;
        hapticMedium();
        try {
          const r = await apiSend('POST', `/api/user/${encodeURIComponent(d.user.user_id)}/balance`, { amount: amt });
          if (r.ok) {
            hapticLight();
            hideFixedBar();
            usersLoaded = false;
            if (cur.page === 'user') renderUserPage(d.user.user_id);
          } else showAppAlert('Ошибка сохранения');
        } catch (e) { showAppAlert('Ошибка соединения'); }
      });
    });
  }

  async function renderUserPage(userId) {
    const container = $('userDetailContent');
    if (!container) return;
    // сразу очищаем страницу, чтобы не мелькали данные предыдущего пользователя
    container.innerHTML = '';
    userPage = null;
    hideFixedBar();
    const startTab = cur.params.tab || 'wallet';
    const uid = encodeURIComponent(userId);
    const safe = (p, fb) => p.catch(() => fb);
    const [user, orders, reviews, refStats, refList, tx] = await Promise.all([
      safe(apiGet(`/api/user/${uid}`), null),
      safe(apiGet(`/api/user-orders?userId=${uid}`), []),
      safe(fetchReviews({ userId }), []),
      safe(apiGet(`/api/referral-stats?userId=${uid}`), { invited: 0, invited24h: 0, earned: 0 }),
      safe(apiGet(`/api/referral-list?userId=${uid}&limit=5`), []),
      safe(apiGet(`/api/wallet-transactions?userId=${uid}&limit=5`), [])
    ]);
    if (cur.page !== 'user' || String(cur.params.id) !== String(userId)) return;
    if (!user) { container.innerHTML = `<div class="review-empty">Пользователь не найден</div>`; return; }

    userPage = { user, orders, reviews, refStats, refList, tx };

    // обновим заголовок, если имя изменилось
    if (user.user_name && user.user_name !== cur.params.name) {
      cur.params.name = user.user_name;
      injectPageHeader();
    }

    const now = Date.now();
    const recent = (ts) => ts && now - Number(ts) <= DAY_MS;
    const ordersDone = orders.filter(o => isCompletedCode(o.status_code));
    const orders24 = orders.filter(o => recent(o.timestamp)).length;
    const done24 = ordersDone.filter(o => recent(o.timestamp)).length;
    const revs24 = reviews.filter(r => r.created_at && now - new Date(r.created_at).getTime() <= DAY_MS).length;
    const bad = reviews.filter(r => reviewRatingOf(r) === 'bad');
    const bad24 = bad.filter(r => r.created_at && now - new Date(r.created_at).getTime() <= DAY_MS).length;

    const avatarHtml = user.photo_url
      ? `<img class="profile-avatar" src="${escapeHtml(user.photo_url)}" alt="avatar">`
      : '<div class="profile-avatar" style="background:var(--input-bg-dark);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--text-secondary);">👤</div>';
    const tgLink = user.user_username ? `https://t.me/${user.user_username}` : null;

    container.innerHTML = `
        <div class="profile-wrapper">
            <div class="profile-main-card" id="userProfileMainCard" ${tgLink ? 'style="cursor:pointer;"' : ''}>
                ${avatarHtml}
                <div class="profile-info" style="display: flex; align-items: flex-end; justify-content: space-between;">
                    <div style="min-width:0;">
                        <div class="profile-nickname">${escapeHtml(user.user_name || 'Без имени')}</div>
                        <div style="margin-top:4px;">
                            <div class="profile-username">${escapeHtml(user.user_username ? '@' + user.user_username : '@username')}</div>
                        </div>
                    </div>
                    <div id="userProfileInfoBtn" title="Информация" style="cursor:pointer;flex-shrink:0;align-self:flex-end;display:flex;align-items:center;justify-content:center;margin-bottom:3px;margin-right:4px;opacity:0.95;">
                        <svg class="icon icon-info-profile icon--accent"><use href="#icon-info"></use></svg>
                    </div>
                </div>
            </div>
            <div class="profile-bottom-card">
                <div class="card-slider" id="userCardSlider">
                    <div class="card-slide"><div>${walletCardInnerHtml(user.balance || 0, 'Баланс кошелька', { plus: 'userWalletPlusBtn', second: 'userWalletGoBtn', secondIcon: ICON_ARROW_RIGHT })}</div></div>
                    <div class="card-slide"><div>${statsInnerHtml(orders.length, `+${orders24}`, 'Всего заказов', ordersDone.length, `+${done24}`, 'Выполненные')}</div></div>
                    <div class="card-slide"><div>${statsInnerHtml(reviews.length, `+${revs24}`, 'Всего отзывов', bad.length, `+${bad24}`, 'Негативные')}</div></div>
                    <div class="card-slide"><div>${statsInnerHtml(refStats.invited || 0, `+${refStats.invited24h || 0}`, 'Приглашено', formatPrice(refStats.earned || 0), '2%', 'Заработано')}</div></div>
                </div>
            </div>
        </div>
        <div id="userTabContent"></div>
        <div class="list-bottom-space"></div>`;

    $('userProfileMainCard')?.addEventListener('click', (e) => {
      if (e.target.closest('#userProfileInfoBtn')) return;
      if (tgLink) { hapticLight(); window.open(tgLink, '_blank'); }
    });
    $('userProfileInfoBtn')?.addEventListener('click', (e) => {
      e.stopPropagation();
      hapticLight();
      showUserInfoAlert(userPage);
    });
    $('userWalletPlusBtn')?.addEventListener('click', () => { hapticLight(); openBalanceBar(); });

    // свайп карточек переключает содержимое страницы
    const slider = $('userCardSlider');
    let scrollTimer = null;
    slider?.addEventListener('scroll', () => {
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        const idx = Math.round(slider.scrollLeft / Math.max(1, slider.clientWidth + 10));
        const tab = USER_TABS[Math.min(USER_TABS.length - 1, Math.max(0, idx))].id;
        if (tab !== cur.params.tab) { hapticLight(); setUserTab(tab, { scroll: false }); }
      }, 60);
    }, { passive: true });

    setUserTab(startTab, { scroll: true });
  }

  // =============================================
  // ОТЗЫВЫ
  // =============================================
  let reviewsCache = null;
  let reviewsFilter = 'all';
  let reviewsSearch = '';

  // Сервисы (как games на фронтенде)
  const ADMIN_GAMES = [
    { name: 'Brawl Stars', get: () => window.brawlProducts || [] },
    { name: 'Clash Royale', get: () => window.crProducts || [] },
    { name: 'Roblox', get: () => window.robloxProducts || [] },
    { name: 'Telegram', get: () => window.tgProducts || [] }
  ];

  function reviewGameName(rv) {
    if (rv.order_game_name) return rv.order_game_name;
    const items = parseItems(rv.order_items);
    const g = ADMIN_GAMES.find(g => items.some(i => g.get().some(p => p.name === i.name)));
    return g ? g.name : null;
  }

  function renderReviewsView() {
    const container = $('reviewsContent');
    if (!container || !reviewsCache) return;
    const list = reviewsCache;
    const goodCount = list.filter(r => reviewRatingOf(r) !== 'bad').length;
    const badCount = list.length - goodCount;

    if (!$('reviewSearchInput')) {
      container.innerHTML = `

  // =============================================
  // ЧАТЫ (переписка с пользователями)
  // =============================================
  const CHAT_TZ = 'Europe/Moscow';
  const CHAT_PAGE_SIZE = 50;
  const CHAT_POLL_MS = 5000;
  const CHAT_LIST_MS = 15000;
  const CHAT_SEARCH_ICON = `<img class="search-icon" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='%239ca3af'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z'%3E%3C/path%3E%3C/svg%3E">`;

  let chatsList = [];
  let chatsLoaded = false;
  let chatsError = false;
  let chatsLoading = false;
  let chatsSearch = '';
  let chatsFilter = 'all'; // all | read | unread

  const chatState = {
    userId: null, user: null, msgs: [], hasMore: true, loadingOld: false, sending: false,
    pollTimer: null, observer: null, blobs: new Map(), pending: new Map(), audio: null, toastTimer: null, token: 0
  };

  function chatDateObj(v) {
    const d = new Date(v);
    return isNaN(d) ? null : d;
  }
  function chatDayKey(d) {
    return new Intl.DateTimeFormat('en-CA', { timeZone: CHAT_TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
  }
  function chatFmtClock(d) {
    return new Intl.DateTimeFormat('ru-RU', { timeZone: CHAT_TZ, hour: '2-digit', minute: '2-digit', hour12: false }).format(d);
  }
  function chatFmtListTime(v) {
    const d = chatDateObj(v);
    if (!d) return '';
    if (chatDayKey(d) === chatDayKey(new Date())) return chatFmtClock(d);
    return new Intl.DateTimeFormat('ru-RU', { timeZone: CHAT_TZ, day: '2-digit', month: '2-digit' }).format(d);
  }
  function chatDayLabel(d) {
    const key = chatDayKey(d);
    const now = new Date();
    if (key === chatDayKey(now)) return 'Сегодня';
    if (key === chatDayKey(new Date(now.getTime() - 86400000))) return 'Вчера';
    return new Intl.DateTimeFormat('ru-RU', { timeZone: CHAT_TZ, day: 'numeric', month: 'long', year: 'numeric' }).format(d);
  }
  function chatTitle(c) {
    return c.user_name || (c.user_username ? '@' + c.user_username : 'Пользователь');
  }
  function chatSub(c) {
    return c.user_username ? '@' + c.user_username : '';
  }
  function chatAvatarHtml(c) {
    const letter = escapeHtml(((c.user_name || c.user_username || '?').trim().charAt(0) || '?').toUpperCase());
    const img = c.photo_url ? `<img src="${escapeHtml(c.photo_url)}" alt="" onerror="this.remove()">` : '';
    return `<div class="chat-avatar">${letter}${img}</div>`;
  }
  const CHAT_KIND_LABELS = {
    photo: 'Фото', video: 'Видео', video_note: 'Видеосообщение',
    voice: 'Голосовое сообщение', animation: 'GIF', sticker: 'Стикер'
  };
  function chatPreviewText(c) {
    const prefix = c.last_direction === 'out' ? 'Бот: ' : '';
    const body = CHAT_KIND_LABELS[c.last_kind] || c.last_text || '';
    return prefix + body;
  }
  function chatMeta(m) {
    if (m._meta) return m._meta;
    let o = {};
    try { o = m.meta ? JSON.parse(m.meta) : {}; } catch (e) { o = {}; }
    m._meta = o && typeof o === 'object' ? o : {};
    return m._meta;
  }
  function chatFmtDur(sec) {
    sec = Math.max(0, Math.round(Number(sec) || 0));
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }

        sel.dataset.sig = sig;

          { key: 'all', label: `Все чаты (${chatsList.length})` },

      }

    if (!chatsLoaded) { el.innerHTML = `<div class="chat-empty">Загрузка…</div>`; return; }
    if (chatsError && !chatsList.length) { el.innerHTML = `<div class="chat-empty">Ошибка загрузки чатов</div>`; return; }

    let list = chatsList;
    if (chatsFilter === 'unread') list = list.filter(c => c.unread);
    if (chatsFilter === 'read') list = list.filter(c => !c.unread);

    const rawQ = chatsSearch.trim();
    if (rawQ) {
      if (rawQ.startsWith('@')) {
        const uq = rawQ.slice(1).toLowerCase();
        list = list.filter(c => (c.user_username || '').toLowerCase().includes(uq));
      } else if (/^\d+$/.test(rawQ)) {
        list = list.filter(c => String(c.user_id).includes(rawQ));
      } else {
        const nq = rawQ.toLowerCase();
        list = list.filter(c => (c.user_name || '').toLowerCase().includes(nq));
      }
    }

    if (!list.length) {
      el.innerHTML = `<div class="chat-empty">${(rawQ || chatsFilter !== 'all') ? 'Ничего не найдено' : 'Чатов пока нет'}</div>`;
      return;
    }
    el.innerHTML = `<div class="chat-list-card">${list.map(c => `
        <div class="chat-row" data-chat-user="${escapeHtml(c.user_id)}" data-user-name="${escapeHtml(chatTitle(c))}" data-user-username="${escapeHtml(c.user_username || '')}">
            ${chatAvatarHtml(c)}
            <div class="chat-row-body">
                <div class="chat-row-top">
                    <span class="chat-row-name">${escapeHtml(chatTitle(c))}</span>
                    <span class="chat-row-time">${escapeHtml(chatFmtListTime(c.last_at))}</span>
                </div>
                <div class="chat-row-bottom">
                    <div class="chat-row-preview">${escapeHtml(chatPreviewText(c))}</div>
                    ${c.unread ? '<span class="chat-unread-dot"></span>' : ''}
                </div>
            </div>
        </div>`).join('')}</div>`;
  }
