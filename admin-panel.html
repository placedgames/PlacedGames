async function loadPromosList() {
    const container = document.getElementById('promosList');
    if (!container) return;
    try {
        const r = await fetch(`${API}/api/promo-codes`, {
            headers: { 'Authorization': `Bearer ${getAdminToken()}` }
        });
        const list = await r.json();
        if (!list.length) { container.innerHTML = '<div class="empty-state"><div class="empty-title">Промокодов нет</div></div>'; return; }
        
        container.innerHTML = list.map(p => {
            const now = new Date();
            const isExpired = p.expires_at && new Date(p.expires_at) < now;
            const isLimitReached = p.max_uses !== null && p.used_count >= p.max_uses;
            const isActive = p.active && !isExpired && !isLimitReached;
            
            let expiresStr = '∞';
            if (p.expires_at) {
                const d = new Date(p.expires_at);
                const hh = String(d.getHours()).padStart(2,'0');
                const mm = String(d.getMinutes()).padStart(2,'0');
                const dd = String(d.getDate()).padStart(2,'0');
                const mo = String(d.getMonth()+1).padStart(2,'0');
                expiresStr = `${hh}:${mm} ${dd}.${mo}`;
            }
            
            const uses = p.max_uses ? `${p.used_count}/${p.max_uses}` : `${p.used_count}/∞`;
            const forUser = p.user_id ? `Для: ${p.user_id}` : 'Для всех';
            
            return `<div class="order-wrapper" style="margin-bottom:14px;">
                <div class="order-main-card" style="position:relative;">
                    <div class="order-header">
                        <span class="order-id">${p.code}</span>
                        <span class="order-card-status ${isActive ? 'status-completed-text status-completed-bg' : 'status-cancelled-text status-cancelled-bg'}">${isActive ? 'Активен' : 'Не активен'}</span>
                    </div>
                    <div class="order-date">${forUser} · Тип: ${p.type === 'first_order' ? 'первый заказ' : 'все'}</div>
                    <div class="order-total">−${p.discount}%</div>
                    <button onclick="deletePromo(${p.id})" style="position:absolute;bottom:12px;right:12px;background:rgba(239,68,68,0.12);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;">
                        <img src="https://storage.botpapa.me/files/19b700d0-4a0d-11f1-bef9-f1ec7a2c6e45.png" style="width:18px;height:18px;">
                    </button>
                </div>
                <div class="order-items-card">
                    <div class="order-item-row"><span class="order-item-name">Использований</span><span class="order-item-price">${uses}</span></div>
                    <div class="order-item-row"><span class="order-item-name">Срок действия</span><span class="order-item-price">${expiresStr}</span></div>
                </div>
            </div>`;
        }).join('');
    } catch(e) {
        container.innerHTML = '<div class="empty-state">Ошибка загрузки</div>';
    }
}

window.deletePromo = async function(id) {
    hapticLight();
    window.Telegram.WebApp.showPopup({
        message: 'Удалить промокод?',
        buttons: [
            { id: 'ok', type: 'destructive', text: 'Удалить' },
            { id: 'cancel', type: 'cancel' }
        ]
    }, async (buttonId) => {
        if (buttonId !== 'ok') return;
        try {
            const r = await fetch(`${API}/api/promo-codes/${id}/delete`, { 
                method: 'DELETE', 
                headers: { 'Authorization': `Bearer ${getAdminToken()}` } 
            });
            if (r.ok) {
                hapticLight();
                loadPromosList();
            } else {
                alert('Ошибка удаления');
            }
        } catch(e) { 
            alert('Ошибка соединения'); 
        }
    });
}

async function renderCreatePromoPage() {
    const container = document.getElementById('createPromoContent');
    const headerContainer = document.getElementById('createPromoHeader');
    if (headerContainer) headerContainer.innerHTML = renderPageHeader('Создать промокод', { showNav: false });
    if (!container) return;

    container.innerHTML = `
    <div class="settings-card" style="margin-bottom: 140px;">
            <div style="display:flex;flex-direction:column;gap:10px;">
                <input id="promoCode" placeholder="Введите промокод" style="background:var(--input-bg);border-radius:34px;padding:14px 16px;color:var(--text-primary);font-size:17px;border:none;outline:none;width:100%;">
                <input id="promoDiscount" type="number" placeholder="Процент скидки" min="1" max="100" style="background:var(--input-bg);border-radius:34px;padding:14px 16px;color:var(--text-primary);font-size:17px;border:none;outline:none;width:100%;">
                <select id="promoType" style="background:var(--input-bg);border-radius:34px;padding:14px 16px;color:var(--text-primary);font-size:17px;border:none;outline:none;width:100%;appearance:none;">
                    <option value="all">Все заказы</option>
                    <option value="first_order">Первый заказ</option>
                </select>
                <input id="promoUserId" placeholder="ID пользователя (необязательно)" style="background:var(--input-bg);border-radius:34px;padding:14px 16px;color:var(--text-primary);font-size:17px;border:none;outline:none;width:100%;">
                <input id="promoExpires" placeholder="Срок действия: 14:08 21.06 (МСК)" style="background:var(--input-bg);border-radius:34px;padding:14px 16px;color:var(--text-primary);font-size:17px;border:none;outline:none;width:100%;">
                <input id="promoMaxUses" type="number" placeholder="Количество активаций (необязательно)" min="1" style="background:var(--input-bg);border-radius:34px;padding:14px 16px;color:var(--text-primary);font-size:17px;border:none;outline:none;width:100%;">
            </div>
        </div>`;

    const oldFixed = document.getElementById('adminFixedBar');
    if (oldFixed) oldFixed.remove();
    const fixedBar = document.createElement('div');
    fixedBar.id = 'adminFixedBar';
    fixedBar.className = 'fixed-action-bar';
    fixedBar.innerHTML = `<div class="action-card-nav"><div class="action-buttons-row"><button class="update-status-btn" id="createPromoSubmitBtn">Создать промокод</button></div></div>`;
    document.body.appendChild(fixedBar);

    setTimeout(() => {
        document.getElementById('createPromoSubmitBtn')?.addEventListener('click', async () => {
            hapticMedium();
            const code = document.getElementById('promoCode')?.value.trim();
            const discount = document.getElementById('promoDiscount')?.value;
            const type = document.getElementById('promoType')?.value;
            const userId = document.getElementById('promoUserId')?.value.trim();
            const expiresRaw = document.getElementById('promoExpires')?.value.trim();
            const maxUses = document.getElementById('promoMaxUses')?.value;

            if (!code || !discount) { alert('Введите код и скидку'); return; }

            // Парсим дату формата "14:08 21.06" по МСК
            let expiresAt = null;
            if (expiresRaw) {
                try {
                    const [timePart, datePart] = expiresRaw.split(' ');
                    const [hh, mm] = timePart.split(':').map(Number);
                    const [dd, mo] = datePart.split('.').map(Number);
                    const year = new Date().getFullYear();
                    // Создаём дату по МСК (UTC+3)
                    const mskDate = new Date(Date.UTC(year, mo - 1, dd, hh - 3, mm));
                    expiresAt = mskDate.toISOString();
                } catch(e) { alert('Неверный формат срока. Используйте: 14:08 21.06'); return; }
            }

            try {
                const r = await fetch(`${API}/api/promo-codes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getAdminToken()}` },
                    body: JSON.stringify({
                        code, discount: parseInt(discount), type,
                        userId: userId || null,
                        expiresAt,
                        maxUses: maxUses || null
                    })
                });
                const data = await r.json();
                if (r.ok) { hapticLight(); showAdminPage('promos'); }
                else alert(data.error || 'Ошибка создания');
            } catch(e) { alert('Ошибка соединения'); }
        });
    }, 0);
}

  function initBackButton() {
    if (window.Telegram?.WebApp) {
      window.Telegram.WebApp.BackButton.onClick(() => {
        hapticLight();
        const oldFixed = document.getElementById('adminFixedBar');
        if (oldFixed) oldFixed.remove();
        if (document.getElementById('detail-page').classList.contains('active-page')) {
          showAdminPage('orders');
        } else if (document.getElementById('promos-page').classList.contains('active-page')) {
    showAdminPage('profile');
} else if (document.getElementById('create-promo-page').classList.contains('active-page')) {
    showAdminPage('promos');
} else if (document.getElementById('user-detail-page').classList.contains('active-page')) {
    showAdminPage('users');
} else {
          showAdminPage('orders');
        }
      });
    }
  }

  document.addEventListener('click', function(e) {
    const doubleBtn = e.target.closest('#headerDoubleBtn');
    if (!doubleBtn) return;
    const isRefresh = e.target.closest('#headerRefreshIcon');
    const isTheme = e.target.closest('#headerThemeIcon');

    if (isRefresh) {
      hapticLight();
      const icon = document.getElementById('headerRefreshIcon');
      icon?.classList.add('spinning');
      showTopLoader();
      const done = () => { icon?.classList.remove('spinning'); hideTopLoader(); };
      let task = Promise.resolve();
      if (currentAdminPage === 'orders') task = loadOrders();
      else if (currentAdminPage === 'users') task = renderUsersPage();
      else if (currentAdminPage === 'reviews') task = renderReviewsPage();
      else if (currentAdminPage === 'profile') task = renderProfilePage();
      else if (currentAdminPage === 'promos') task = loadPromosList();
      Promise.resolve(task).finally(done);
    } else if (isTheme) {
      hapticLight();
      const icon = doubleBtn.querySelector('#headerThemeIcon');
      if (icon) {
        const rotation = (parseInt(icon.dataset.rotation || '0', 10) + 180);
        icon.style.transform = `rotate(${rotation}deg)`;
        icon.dataset.rotation = rotation;
      }
      const current = localStorage.getItem('appTheme') || 'dark';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    }
  });

  // Переключение страниц прямо из шапки (единый логотип + системный select), как во фронтенде
  document.addEventListener('change', function(e) {
    if (e.target.id === 'pageHeaderNavSelect') {
      hapticLight();
      const page = e.target.value;
      showAdminPage(page);
      if (page === 'orders') loadOrders();
    }
  });

  document.querySelectorAll('.menu-item').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.id === 'profileMenuBtn' && profileLongPressFired) {
        profileLongPressFired = false;
        return;
      }
      hapticLight();
      showAdminPage(btn.dataset.page);
      if (btn.dataset.page === 'orders') loadOrders();
    });
  });

  // Удержание аватара профиля — алерт сброса кэша / изменения формата (как во фронтенде)
  let profileLongPressFired = false;
  (function setupProfileLongPress() {
    const profileBtn = document.getElementById('profileMenuBtn');
    if (!profileBtn) return;
    const LONG_PRESS_MS = 350;
    let pressTimer = null;
    function startPress() {
      profileLongPressFired = false;
      pressTimer = setTimeout(() => {
        profileLongPressFired = true;
        hapticMedium();
        showAdditionalSettingsAlert();
      }, LONG_PRESS_MS);
    }
    function cancelPress() { clearTimeout(pressTimer); }
    profileBtn.addEventListener('pointerdown', startPress);
    profileBtn.addEventListener('pointerup', cancelPress);
    profileBtn.addEventListener('pointerleave', cancelPress);
    profileBtn.addEventListener('pointercancel', cancelPress);
  })();

  const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
  if (tgUser?.photo_url) {
    document.getElementById('profileMenuAvatar').src = tgUser.photo_url;
  }

  window.addEventListener('popstate', () => {
    const oldFixed = document.getElementById('adminFixedBar');
    if (oldFixed) oldFixed.remove();
    if (document.getElementById('detail-page').classList.contains('active-page')) {
      showAdminPage('orders');
    } else if (document.getElementById('promos-page').classList.contains('active-page')) {
      showAdminPage('profile');
    } else if (document.getElementById('create-promo-page').classList.contains('active-page')) {
      showAdminPage('promos');
    } else if (document.getElementById('user-detail-page').classList.contains('active-page')) {
      showAdminPage('users');
    } else {
      showAdminPage('orders');
    }
  });
  
  initBackButton();
  showAdminPage('orders');
  loadOrders();
  setInterval(loadOrders, 30000);
  
})();
</script>
</body>
</html>
