<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<script>
(function() {
  const theme = localStorage.getItem('appTheme') || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  if (localStorage.getItem('darkVariant') === 'tinted') document.documentElement.setAttribute('data-dark', 'tinted');
})();
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="products.js"></script>
<meta name="theme-color" content="#121214">
<title>Админ панель</title>
<style>
.page {
    display: none !important;
}

.page.active-page {
    display: block !important;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

:root {
    --app-bg: #111112;
    --card-bg: #232326;
    --col-bg: #141415;
    --slider-bg: #1c1c1e;
    --header-btn-bg: #242427;
    --text-primary: #ffffff;
    --text-secondary: #9e9e9e;
    --text-muted: #cbcdcd;
    --text-price-old: #9ca3af;
    --border-color: rgba(40, 40, 43, 1);
    --divider-color: rgba(51, 51, 54, 1);
    --input-bg: #3a3a3d;
    --input2-bg: #323235;
    --input-bg-dark: #303033;
    --sticky-bg: rgba(40, 40, 44, 0.99);
    --sticky-bg2: rgba(38, 38, 42, 0.99);
    --bottom-menu-border: rgba(57, 57, 60, 1);
    --fixed-border: rgba(50, 50, 53, 1);
    --menu-slider-bg: rgba(200, 200, 204, 0.1);
    --accent-blue-bg: rgba(56, 150, 200, 0.1);
    /* ===== Размеры иконок (редактируй здесь) ===== */
    /* Шапка */
    --icon-size-header-title: 22px;
    --icon-size-header-refresh: 27.3px;
    --icon-size-header-theme: 25.3px;
    /* Фильтры */
    --icon-size-filter-catalog: 27px;
    --icon-size-filter-game: 27px;
    /* Нижнее меню */
    --icon-size-nav-catalog: 26px;
    --icon-size-nav-cart: 31px;
    --icon-size-nav-orders: 30px;
    /* Корзина */
    --icon-size-cart-warn: 21px;
    --icon-size-cart-qty-minus: 14px;
    --icon-size-cart-qty-plus: 14px;
    /* Счётчик в карточке товара */
    --icon-size-counter-minus: 14px;
    --icon-size-counter-plus: 14px;
    /* Промокод */
    --icon-size-promo-open: 26px;
    --icon-size-promo-apply: 19px;
    --icon-size-promo-back: 16px;
    /* Оформление / оплата */
    --icon-size-payment-copy: 17px;
    --icon-size-payment-help: 24px;
    /* Заказ (код / отзыв) */
    --icon-size-order-code-help: 24px;
    --icon-size-order-code-submit: 19px;
    --icon-size-order-review-help: 24px;
    /* Иконки info (везде свой размер) */
    --icon-size-info-cart: 21px;
    --icon-size-info-order-status: 21px;
    --icon-size-info-profile: 24px;
    --icon-size-info-field: 19px;
    /* Отзывы */
    --icon-size-reviews-help: 24px;
    --icon-size-writereview-help: 24px;
    /* Пустые состояния */
    --icon-size-empty-cart: 80px;
    --icon-size-empty-orders: 80px;
    --icon-size-empty-game-reload: 80px;
    --icon-size-empty-game-notfound: 80px;
    /* Профиль */
    --icon-size-profile-referral-copy: 17px;
    /* ===== Цвета иконок (редактируй здесь) ===== */
    --icon-color-accent: #4cb4e9;
    --icon-color-muted: var(--text-secondary);
    --icon-color-primary: var(--text-primary);
    --icon-color-warning: #eab308;
    --icon-color-danger: #ef4444;
    --col-border-color: rgba(32, 32, 35, 1);
    --bottom-menu-offset: 16px;
}

[data-theme="light"] {
    --app-bg: #EFEFF3;
    --card-bg: #ffffff;
    --col-bg: #e8e8ed;
    --slider-bg: var(--col-bg);
    --header-btn-bg: var(--card-bg);
    --text-primary: #000000;
    --text-secondary: #6e6e73;
    --text-muted: #6e6e73;
    --text-price-old: #8e8e93;
    --border-color: #e3e3ea;
    --divider-color: #e3e3ea;
    --input-bg: #e8e8ed;
    --input2-bg: #e8e8ed;
    --input-bg-dark: #dddde2;
    --sticky-bg: rgba(254, 254, 255, 0.9);
    --sticky-bg2: rgba(254, 254, 255, 0.9);
    --bottom-menu-border: #e3e3ea;
    --fixed-border: #e3e3ea;
    --menu-slider-bg: rgba(80, 80, 83, 0.08);
    --accent-blue-bg: rgba(56, 150, 200, 0.1);
    --col-border-color: var(--border-color);
}

/* Tinted тёмная тема (как во фронтенде) */
html[data-dark="tinted"]:not([data-theme="light"]) {
    --app-bg: #181D23;
    --card-bg: #242D38;
    --col-bg: #1B2027;
    --slider-bg: #1B2027;
    --header-btn-bg: #242D38;
    --border-color: #29333F;
    --divider-color: #2F3A47;
    --col-border-color: #252E39;
    --fixed-border: #2F3A47;
    --bottom-menu-border: #35414F;
    --input-bg: #333F4D;
    --input2-bg: #303B48;
    --input-bg-dark: #2D3844;
    --sticky-bg: rgba(43, 54, 66, 0.99);
    --sticky-bg2: rgba(39, 49, 60, 0.99);
    --menu-slider-bg: rgba(190, 215, 240, 0.1);
}

body {
    background-color: var(--app-bg);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-primary);
    padding-bottom: 130px;
}

body {
    padding-top: var(--tg-safe-area-inset-top, 0px);
}

body {
    -webkit-user-select: none;
    user-select: none;
}

#payment-page .form-select-readonly,
#payment-page .card-number-text {
    -webkit-user-select: text;
    user-select: text;
}

body {
    touch-action: pan-y;
}

.page-header-sticky {
    position: relative;
    top: 0;
    z-index: 500;
    margin: 0 -13px 5px -13px;
    padding: calc(var(--tg-content-safe-area-inset-top, 12px) + 6px) 13px 8px 13px;
    background: var(--app-bg);
}

.page-header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: transparent;
    border: none;
    padding: 0;
    height: 45px;
    position: relative;
}

.page-header-inner::before {
    content: '';
    position: absolute;
    left: 21px;
    right: 21px;
    top: 0;
    bottom: 0;
    border-top: 1px solid rgba(255, 255, 255, 0);
    border-bottom: 1px solid rgba(255, 255, 255, 0);
    pointer-events: none;
    z-index: 0;
}

.page-header-title-btn {
    display: inline-flex;
    align-items: center;
    background: var(--header-btn-bg);
    border: 1px solid var(--border-color);
    border-radius: 50px;
    height: 45px;
    padding: 0 17px 0 14px;
    position: relative;
    z-index: 1;
    flex: 0 0 auto;
}

.page-header-title-btn span {
    font-size: 18px;
    font-weight: 550;
    color: var(--text-primary);
    white-space: nowrap;
}

.page-header-icon-wrap {
    width: 23px;
    margin-right: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.tg-top-loader {
    position: fixed;
    top: calc(var(--tg-safe-area-inset-top, 0px) + 20px);
    left: 50%;
    transform: translateX(-50%);
    display: none;
    gap: 5px;
    z-index: 100000;
    pointer-events: none;
}

.tg-top-loader.visible {
    display: flex;
}

.tg-top-loader span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffffff;
    opacity: 0.25;
    animation: tgDotPulse 1.1s infinite ease-in-out;
}

.tg-top-loader span:nth-child(1) {
    animation-delay: 0s;
}

.tg-top-loader span:nth-child(2) {
    animation-delay: 0.18s;
}

.tg-top-loader span:nth-child(3) {
    animation-delay: 0.36s;
}

@keyframes tgDotPulse {
    
    0%, 60%, 100% {
        opacity: 0.25;
        transform: scale(1);
    }
    
    30% {
        opacity: 1;
        transform: scale(1.25);
    }
}

.browser-blocker {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: #161618;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
}

.browser-blocker-content {
    max-width: 300px;
}

.browser-blocker-icon {
    width: 80px;
    height: 80px;
    margin-bottom: 20px;
}

.browser-blocker-title {
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 12px;
}

.browser-blocker-text {
    font-size: 16px;
    color: var(--text-secondary);
    line-height: 1.4;
}

.page {
    display: none;
    padding: 0 16px 20px 16px;
    max-width: none;
    margin: 0 auto;
}

.page.active-page {
    display: block;
}

.menu-slider {
    position: absolute;
    top: 4px;
    left: 4px;
    height: calc(100% - 8px);
    width: calc(33.33% - 4px);
    background: var(--menu-slider-bg);
    border-radius: 50px;
    transition: left 0.2s cubic-bezier(0.4, 0, 0.2, 1), width 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-radius 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
    z-index: 2;
}

.menu-slider.no-transition {
    transition: none !important;
}

@media (hover: none) and (pointer: coarse) {
    body:has(input:focus, textarea:focus) #bottomMenuWrapper {
        display: none !important;
    }
    body:has(input:focus, textarea:focus) #cartCheckoutFixed {
        display: none !important;
    }
    body:has(#cartCheckoutFixed input:focus, #cartCheckoutFixed textarea:focus) #bottomMenuWrapper {
        display: flex !important;
    }
    body:has(#cartCheckoutFixed input:focus, #cartCheckoutFixed textarea:focus) #cartCheckoutFixed {
        display: block !important;
    }
}

.menu-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: none;
    border: none;
    cursor: pointer;
    transition: all 0.1s;
    flex: 1;
    padding: 5px 0 2px 0;
    position: relative;
    z-index: 3;
}

.menu-icon-wrap {
    height: 28px;
    /* фиксированная высота — под самую крупную из nav-иконок */
    display: flex;
    align-items: center;
    justify-content: center;
}

.menu-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-top: 2px;
}

.menu-icon {
    transition: all 0.1s;
}

.menu-icon-inactive {
    display: block;
}

.menu-icon-active {
    display: none;
}

.menu-item.active .menu-icon-inactive {
    display: none;
}

.menu-item.active .menu-icon-active {
    display: block;
}

.menu-item.active .menu-label {
    color: #4cb4e9;
}

.menu-item:nth-child(1) .menu-icon-wrap,
.menu-item:nth-child(1) .menu-label {
    transform: translateX(-1px);
}

.menu-item:nth-child(3) .menu-icon-wrap,
.menu-item:nth-child(3) .menu-label {
    transform: translateX(1px);
}

.search-section {
    display: flex;
    gap: 0;
    margin-bottom: 14px;
    align-items: center;
    position: relative;
}

.search-bar {
    flex: 1;
    background: var(--card-bg);
    height: 53px;
    border-radius: 36px;
    border: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    position: relative;
    z-index: 2;
}

.search-icon {
    width: 20px;
    height: 20px;
    filter: brightness(0) saturate(100%) invert(70%);
}

.search-clear-btn {
    display: none;
    align-items: center;
    justify-content: center;
    width: 23px;
    height: 23px;
    flex-shrink: 0;
    cursor: pointer;
    opacity: 0.7;
}

.search-clear-btn.visible {
    display: flex;
}

.search-input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 19px;
    font-weight: 500;
    width: 100%;
}

.search-input::placeholder {
    color: #a1a1aa;
    font-size: 19px;
}

.filter-btn {
    background: transparent;
    border: 1px solid var(--col-border-color);
    width: 110px;
    height: 53px;
    border-radius: 36px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 18px;
    cursor: pointer;
    flex-shrink: 0;
    margin-left: -65px;
    position: relative;
    z-index: 1;
}

.checkout-card-outline {
    border-color: var(--col-border-color);
}

.products-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
}

@media (min-width: 600px) {
    .products-grid {
        grid-template-columns: repeat(4, 1fr);
    }
}

@media (min-width: 900px) {
    .products-grid {
        grid-template-columns: repeat(5, 1fr);
    }
}

@media (min-width: 1200px) {
    .products-grid {
        grid-template-columns: repeat(6, 1fr);
    }
}

@media (min-width: 1600px) {
    .products-grid {
        grid-template-columns: repeat(7, 1fr);
    }
}

.product-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 42px 42px 28px 28px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.1s linear;
    position: relative;
}

.product-title-row {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    margin-bottom: 4px;
    cursor: pointer;
}

svg.product-info-icon {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    color: #8e8e93;
}

.card-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    padding: 7px;
    border-radius: 42px;
    box-sizing: border-box;
}

.card-img-carousel {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 42px;
    overflow: hidden;
    box-sizing: border-box;
    background: var(--card-bg);
}

.card-img-track {
    position: absolute;
    top: 7px;
    right: 7px;
    bottom: 7px;
    left: 7px;
    display: flex;
    gap: 8px;
    transition: transform 0.25s ease;
    touch-action: pan-y;
}

.card-img-track .card-img {
    width: 100%;
    height: 100%;
    flex-shrink: 0;
    object-fit: cover;
    padding: 0;
    border-radius: 36px;
    box-sizing: border-box;
}

.card-img-dots {
    position: absolute;
    bottom: 14px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 5px;
    pointer-events: none;
}

.card-img-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.4);
    transition: background 0.2s, width 0.2s;
}

.card-img-dot.active {
    background: #ffffff;
    width: 14px;
    border-radius: 4px;
}

.card-info {
    padding: 0 8px 8px 8px;
}

.card-img-carousel+.card-info {
    padding-top: 5px;
}

.product-title {
    font-size: 18px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
}

.price-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 6px 0 10px 0;
}

.current-price {
    font-size: 19px;
    font-weight: 500;
    color: var(--text-primary);
}

.old-price {
    font-size: 16px;
    color: var(--text-price-old);
    text-decoration: line-through;
}

.card-action-btn {
    width: 100%;
    height: 40px;
    border-radius: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-weight: 550;
    font-size: 17px;
    transition: 0.1s;
    background: #4cb4e9;
    border: none;
    color: white;
}

.cart-add-btn {
    background: #4cb4e9;
    color: white;
}

.counter-btn {
    background: var(--accent-blue-bg);
    color: #4cb4e9;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 12px;
}

.counter-minus,
.counter-plus {
    width: 16px;
    height: 16px;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.counter-value {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-primary);
}

.empty-state-icon {
    text-align: center;
    margin-top: 120px;
}

.empty-title {
    font-size: 18px;
    color: #a1a1aa;
    margin-bottom: 20px;
}

.empty-catalog-btn {
    background: #4cb4e9;
    border: none;
    border-radius: 34px;
    padding: 12px 24px;
    color: white;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
}

.cart-item {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 31px 31px 29px 29px !important;
    padding: 9px;
    margin-bottom: 12px;
    display: flex;
    gap: 14px;
    align-items: center;
    position: relative;
}

.cart-item-wrapper {
    position: relative;
    margin-bottom: 12px;
}

.cart-item-wrapper .cart-item {
    margin-bottom: 0;
    position: relative;
    z-index: 2;
}

.cart-item-delivery {
    background: var(--col-bg);
    border: 1px solid var(--col-border-color);
    border-radius: 0 0 29px 29px;
    padding: 16px 17px;
    margin-top: -30px;
    padding-top: 42px;
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.cart-item-delivery-label {
    font-size: 16px;
    color: var(--text-muted);
    font-weight: 500;
}

.cart-item-delivery-value {
    font-size: 16px;
    color: var(--text-secondary);
    font-weight: 500;
}

.cart-img {
    width: 94px;
    height: 94px;
    border-radius: 22px !important;
    object-fit: cover;
    flex-shrink: 0;
}

.cart-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 7px;
    min-width: 0;
}

.cart-product-name {
    font-size: 18px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: calc(100% - 78px);
}

.cart-product-price {
    font-size: 18px;
    font-weight: 500;
    color: var(--text-primary);
}

.cart-product-category {
    font-size: 18px;
    color: var(--text-secondary);
}

.cart-actions {
    position: absolute;
    bottom: 10px;
    right: 10px;
}

.cart-quantity {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--accent-blue-bg);
    border-radius: 40px;
    padding: 6px 10px;
}

.cart-qty-btn {
    background: none;
    border: none;
    width: 22px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.cart-qty-value {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-primary);
    min-width: 20px;
    text-align: center;
}

.cart-checkout-fixed {
    position: fixed;
    bottom: var(--bottom-menu-offset, 16px);
    left: 16px;
    right: 16px;
    z-index: 1000;
    max-width: none;
    margin: 0 auto;
    width: calc(100% - 32px);
}

.checkout-card {
    background: var(--sticky-bg2);
    backdrop-filter: blur(12px);
    border-radius: 34px;
    padding: 14px;
    padding-bottom: 79px;
    border: 1px solid var(--fixed-border);
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-left: 5px;
    padding-right: 5px;
}

.total-label {
    color: var(--text-muted);
    font-size: 18px;
    font-weight: 500;
}

.promo-label {
    color: var(--text-muted);
    font-size: 18px;
    font-weight: 500;
}

.total-price-wrapper {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding-right: 3px;
}

.total-price {
    color: var(--text-primary);
    font-weight: 550;
    font-size: 18px;
}

.total-old-price {
    color: var(--text-price-old);
    font-size: 16px;
    text-decoration: line-through;
}

.checkout-buttons-row {
    display: flex;
    gap: 8px;
    align-items: center;

/* ==========================================================

   (всё выше — styles.css фронтенда без изменений)
   ========================================================== */

/* Админу нужно уметь выделять и копировать данные */
body, body * {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
}
button, .menu-item, .page-header-double-btn, .page-header-title-btn {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

html { overflow-x: hidden; }
body { overflow-x: hidden; }

/* Пустой экран, пока идёт проверка доступа (как на фронтенде — без текста и спиннера) */
#loaderOverlay {

    inset: 0;

.chat-empty {
    text-align: center;
    color: var(--text-secondary);
    padding: 30px 0;

/* ---------- Чаты: полноэкранная переписка ---------- */
.chat-view {
    position: fixed;
    inset: 0;
    z-index: 1100;
    background: var(--app-bg);
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
}
/* закреплённый верх: шапка страницы + графа профиля (не двигаются вместе с перепиской) */
.chat-top {
    position: absolute;
    top: var(--tg-safe-area-inset-top, 0px);
    left: 0;
    right: 0;
    z-index: 5;
    padding: calc(var(--tg-content-safe-area-inset-top, 12px) + 6px) 16px 0;
    background: none;
    pointer-events: none;
}
.chat-top .page-header-sticky { background: transparent; pointer-events: none; }
.chat-top .page-header-title-btn,
.chat-top .page-header-double-btn,
.chat-top .chat-profile-bar { pointer-events: auto; }
.chat-profile-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    height: 55px;
    padding: 0 6px;
    margin-bottom: 8px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 36px;
}
.chat-round-btn {
    width: 43px;
    height: 43px;
    min-width: 43px;
    border-radius: 50%;
    border: none;
    background: rgba(160, 165, 175, 0.24);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
}
.chat-round-btn svg { stroke: none; }
/* плавный блюр: от низа графы профиля вверх, чем выше — тем сильнее */
.chat-blur {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 120px;
    z-index: 4;
    pointer-events: none;
}
.chat-blur i { position: absolute; inset: 0; display: block; }
.chat-blur-bottom { top: auto; bottom: 0; height: 90px; }
.chat-blur-bottom i:nth-child(1) {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 40%); mask-image: linear-gradient(to bottom, transparent 0%, #000 40%);
}
.chat-blur-bottom i:nth-child(2) {
    -webkit-mask-image: linear-gradient(to bottom, transparent 20%, #000 60%); mask-image: linear-gradient(to bottom, transparent 20%, #000 60%);
}
.chat-blur-bottom i:nth-child(3) {
    -webkit-mask-image: linear-gradient(to bottom, transparent 40%, #000 80%); mask-image: linear-gradient(to bottom, transparent 40%, #000 80%);
}
.chat-blur-bottom i:nth-child(4) {
    -webkit-mask-image: linear-gradient(to bottom, transparent 60%, #000 100%); mask-image: linear-gradient(to bottom, transparent 60%, #000 100%);
}
/* долгое нажатие вместо выделения текста */
.chat-msg, .chat-msg * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
.chat-blur i:nth-child(1) {
    -webkit-backdrop-filter: blur(1px); backdrop-filter: blur(1px);
    -webkit-mask-image: linear-gradient(to top, transparent 0%, #000 40%); mask-image: linear-gradient(to top, transparent 0%, #000 40%);
}
.chat-blur i:nth-child(2) {
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    -webkit-mask-image: linear-gradient(to top, transparent 20%, #000 60%); mask-image: linear-gradient(to top, transparent 20%, #000 60%);
}
.chat-blur i:nth-child(3) {
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    -webkit-mask-image: linear-gradient(to top, transparent 40%, #000 80%); mask-image: linear-gradient(to top, transparent 40%, #000 80%);
}
.chat-blur i:nth-child(4) {
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    -webkit-mask-image: linear-gradient(to top, transparent 60%, #000 100%); mask-image: linear-gradient(to top, transparent 60%, #000 100%);
}
.chat-profile-avatar {
    width: 43px;
    height: 43px;
    min-width: 43px;
    font-size: 18px;
}
.chat-profile-center {
    flex: 1;
    min-width: 0;

    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;

.chat-profile-name {

    font-size: 18px;

    color: var(--text-primary);

    overflow: hidden;
    text-overflow: ellipsis;
}
.chat-profile-sub {
    max-width: 100%;
    font-size: 14px;
    line-height: 1.25;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.chat-messages {

    overflow-y: auto;

}

    max-width: 82%;
    margin-bottom: 6px;
}
.chat-msg.in { align-self: flex-start; align-items: flex-start; }
.chat-msg.out { align-self: flex-end; align-items: flex-end; }
.chat-msg.pending { opacity: 0.6; }
.chat-bubble {
    display: flow-root;
    position: relative;
    padding: 7px 11px 6px;
    border-radius: 18px;
    background: var(--card-bg);
    border: none;
    color: var(--text-primary);

    line-height: 1.35;

    word-wrap: break-word;

}

/* сообщение админа: синее, без обводки */
.chat-msg.out .chat-bubble {
    border-bottom-right-radius: 6px;

    color: #ffffff;
}
.chat-text { white-space: pre-wrap; color: var(--text-primary); }
.chat-msg.out .chat-text { color: #ffffff; }
.chat-text + .chat-text { margin-top: 4px; }
.chat-muted { color: var(--text-secondary); font-style: italic; }
/* время — в правом нижнем углу сообщения, текст его не перекрывает */
.chat-time {
    float: right;
    margin: 5px 0 -3px 10px;
    font-size: 12px;
    line-height: 1.2;
    color: var(--text-secondary);
    white-space: nowrap;
}

    padding: 3px 5px 0 0;

    line-height: 1.2;
    color: var(--text-secondary);
}

/* сообщения с медиа */
.chat-bubble.has-media { padding: 5px; }
.chat-bubble.has-media .chat-caption { padding: 6px 6px 2px; }
.chat-bubble.is-bare { background: none; border: none; padding: 0; }
.chat-bubble.is-bare .chat-time-row { padding: 2px 4px 0 0; }
.chat-media {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--input-bg-dark);
    border-radius: 13px;
    color: var(--text-secondary);

}
.chat-photo, .chat-video { width: 100%; }
.chat-bubble.has-photo { min-width: min(260px, 66vw); }
.chat-media > img, .chat-media > video {

    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.chat-media > video { background: #000; }
.chat-video video { object-fit: contain; }
.chat-media.is-sticker { width: 150px; height: 150px; background: none; border-radius: 0; font-size: 56px; }
.chat-media.is-sticker img { object-fit: contain; }
.chat-media.is-round { width: min(200px, 56vw); height: min(200px, 56vw); border-radius: 50%; }
.chat-play {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 48px;
    height: 48px;
    margin: -24px 0 0 -24px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}
.chat-play svg { fill: #ffffff; display: block; }
.chat-dur {
    position: absolute;
    left: 8px;
    top: 8px;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.55);
    color: #ffffff;
    font-size: 12px;
    line-height: 1.3;
    pointer-events: none;
}
.chat-media.loading .chat-play { display: none; }
.chat-media.loading::after, .chat-voice.loading .chat-voice-btn::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 26px;
    height: 26px;
    margin: -13px 0 0 -13px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.35);
    border-top-color: #ffffff;
    animation: chatSpin 0.8s linear infinite;
}
@keyframes chatSpin { to { transform: rotate(360deg); } }

/* голосовые */
.chat-voice {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 200px;
    padding: 4px 8px 0 4px;
}
.chat-voice-btn {
    position: relative;
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 50%;
    border: none;
    background: var(--icon-color-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
}
.chat-voice-btn svg { fill: #ffffff; display: block; }
.chat-voice-btn span { display: flex; align-items: center; justify-content: center; }
.chat-voice .ic-pause { display: none; }
.chat-voice.playing .ic-pause { display: block; }
.chat-voice.playing .ic-play { display: none; }
.chat-voice.loading .chat-voice-btn svg { opacity: 0; }
.chat-voice-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.chat-voice-bar { height: 7px; border-radius: 4px; background: var(--input-bg-dark); overflow: hidden; }
.chat-voice-bar i { display: block; height: 100%; width: 0; background: var(--icon-color-accent); }
.chat-voice-dur { font-size: 12px; line-height: 1.2; color: var(--text-secondary); }

/* просмотр фото на весь экран */
.chat-lightbox {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.92);
    cursor: pointer;
}
.chat-lightbox.open { display: flex; animation: chatFade 0.15s ease; }
.chat-lightbox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
}
@keyframes chatFade { from { opacity: 0; } to { opacity: 1; } }

/* поле ввода: закреплено как нижнее меню, отступ — --bottom-menu-offset (настройки) */
.chat-input-bar {
    position: absolute;
    left: 19px;
    right: 19px;
    bottom: var(--bottom-menu-offset, 16px);
    z-index: 6;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    min-height: 52px;
    padding: 6px 6px 6px 18px;
    background: var(--header-btn-bg);
    border: 1px solid var(--border-color);
    border-radius: 30px;
}
.chat-input {
    flex: 1;
    min-width: 0;
    resize: none;
    background: transparent;
    border: none;
    padding: 9px 0;
    font-size: 18px;
    font-family: inherit;
    line-height: 1.3;
    color: var(--text-primary);
    max-height: 120px;
    outline: none;
}
.chat-input::placeholder { color: #a1a1aa; }
.chat-send-btn {
    width: 56px;
    height: 38px;
    min-width: 56px;
    margin-bottom: 1px;
    border-radius: 20px;
    border: none;
    background: var(--icon-color-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
}
.chat-send-btn svg { stroke: #ffffff; }
.chat-send-btn:disabled { opacity: 0.4; }
.chat-toast {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: calc(var(--bottom-menu-offset, 16px) + 72px);
    z-index: 7;
    text-align: center;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 15px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
}
.chat-toast.visible { opacity: 1; }

/* ---------- Статистика ---------- */
.stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
}
.stat-tile {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    padding: 14px 16px;
    min-width: 0;
}
.stat-tile-value {
    font-size: 19px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.stat-tile-label {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 4px;
}
.stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 30px;
    padding: 16px 17px 16px 19px;
    margin-bottom: 14px;
}
.stat-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
}
.stat-card-title {
    font-size: 19px;
    font-weight: 550;
    color: var(--text-primary);
}
.stat-card-sub {
    font-size: 15px;
    color: var(--text-secondary);
    margin: -6px 0 12px;
}
.stat-seg {
    display: flex;
    background: var(--col-bg);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 3px;
    flex-shrink: 0;
}
.stat-seg button {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 16px;
    cursor: pointer;
}
.stat-seg button.active {
    background: var(--card-bg);
    color: var(--icon-color-accent);
}
.stat-bars {
    display: flex;
    align-items: stretch;
    gap: 3px;
    height: 150px;
}
.stat-bar-col {
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: flex-end;
}
.stat-bar {
    width: 100%;
    border-radius: 4px 4px 0 0;
    background: var(--icon-color-accent);
}
.stat-bar.zero {
    height: 2px !important;
    border-radius: 1px;
    background: var(--divider-color);
}
.stat-bars-axis {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 6px;
}
.stat-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
}
.stat-row + .stat-row { border-top: 1px solid var(--divider-color); }
.stat-rank {
    width: 22px;
    min-width: 22px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    text-align: center;
}
.stat-row-main {
    flex: 1;
    min-width: 0;
}
.stat-row-name {
    font-size: 16px;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.stat-row-sub {
    font-size: 14px;
    color: var(--text-secondary);
}
.stat-row-val {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    flex-shrink: 0;
}
.stat-share {
    height: 6px;
    border-radius: 3px;
    background: var(--col-bg);
    overflow: hidden;
    margin-top: 6px;
}
.stat-share > span {
    display: block;
    height: 100%;
    background: var(--icon-color-accent);
    border-radius: 3px;
}
.stat-hours {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 4px;
}
.stat-hour {
    aspect-ratio: 1 / 1;
    border-radius: 7px;
    background: var(--col-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--text-secondary);
}
.stat-empty {
    text-align: center;
    color: var(--text-secondary);
    font-size: 15px;
    padding: 14px 0;
}
</style>

        </button>
